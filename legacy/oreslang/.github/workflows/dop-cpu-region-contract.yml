name: DOP CPU region contract
on:
  pull_request:
    paths:
      - 'contracts/v1/dop-cpu-regions/**'
      - 'scripts/verify_dop_cpu_regions.py'
      - '.github/workflows/dop-cpu-region-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact DOP CPU region checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate shared CPU region contract and negative reports
        run: python3 scripts/verify_dop_cpu_regions.py --self-test
