name: dotnet static import NativeAOT proof
on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'host/**'
      - 'runtime/**'
      - 'verification/**'
      - 'examples/interop/**'
      - '.github/workflows/dotnet-static-import-native-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-aot-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Refuse to validate a merge commit or stale source checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "DOTNET_IMPORT_SOURCE_HEAD=$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Executed compiler and runtime tests
        run: dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
      - name: Publish native compiler and host with statically imported .NET method
        run: bash scripts/publish-linux.sh examples/interop/dotnet-math-abs.atto artifacts/dotnetimport --structured
      - name: Publish second native guest with nested Min/Max/Abs
        run: bash scripts/publish-linux.sh examples/interop/dotnet-math-nested.atto artifacts/dotnetnested --structured
      - name: Verify native compiler refuses unauthorized .NET imports without emitting CIL
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler=artifacts/compiler/linux-x64/oresnet
          mkdir -p artifacts/denied
          output=artifacts/denied/OresGenerated.dll
          for source in examples/interop/reject-unauthorized-file.atto examples/interop/reject-math-overload.atto examples/interop/reject-alias-shadow.atto; do
            rm -f "$output"
            if "$compiler" compile-structured "$source" --out "$output" > artifacts/denied/diagnostic.txt 2>&1; then
              echo "unauthorized source unexpectedly compiled: $source" >&2
              exit 1
            fi
            test ! -e "$output"
            case "$source" in
              *file.atto|*shadow.atto) grep -q DOTNET_IMPORT_UNSUPPORTED artifacts/denied/diagnostic.txt ;;
              *overload.atto) grep -q 'requires int operands' artifacts/denied/diagnostic.txt ;;
            esac
          done
          echo 'DOTNET_IMPORT_NATIVE_DENIALS_EXECUTED|cases=3|cil=none'
      - name: Execute both independent native guest binaries and verify output
        shell: bash
        run: |
          set -Eeuo pipefail
          binary=artifacts/dotnetimport/linux-x64/oreslang-app
          file "$binary"
          readelf -h "$binary" >/dev/null
          nested=artifacts/dotnetnested/linux-x64/oreslang-app
          file "$nested"
          readelf -h "$nested" >/dev/null
          output="$("$binary")"
          test "$output" = '42'
          nested_output="$("$nested")"
          test "$nested_output" = '42'
          test "$("$binary")" = '42' # no stale CIL cross-contamination
          sha256sum "$binary" "$nested" artifacts/compiler/linux-x64/oresnet artifacts/generated/linux-x64/OresGenerated.dll
          git rev-parse HEAD
          git status --porcelain
          echo 'DOTNET_IMPORT_NATIVE_AOT_EXECUTED|abs=42|nested=42'
