name: dotnet static import NativeAOT proof
on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'host/**'
      - 'runtime/**'
      - 'verification/**'
      - 'examples/interop/**'
      - 'scripts/publish-windows.ps1'
      - '.github/workflows/dotnet-static-import-native-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-aot-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Refuse to validate a merge commit or stale source checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "DOTNET_IMPORT_SOURCE_HEAD=$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Executed compiler and runtime tests
        run: dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
      - name: Publish native compiler and host with statically imported .NET method
        run: bash scripts/publish-linux.sh examples/interop/dotnet-math-abs.atto artifacts/dotnetimport --structured --interop-math-i64
      - name: Publish second native guest with nested Min/Max/Abs
        run: bash scripts/publish-linux.sh examples/interop/dotnet-math-nested.atto artifacts/dotnetnested --structured --interop-math-i64
      - name: Verify native compiler refuses unauthorized .NET imports without emitting CIL
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler=artifacts/compiler/linux-x64/oresnet
          mkdir -p artifacts/denied
          output=artifacts/denied/OresGenerated.dll
          for source in examples/interop/reject-unauthorized-file.atto examples/interop/reject-math-overload.atto examples/interop/reject-alias-shadow.atto; do
            rm -f "$output"
            if "$compiler" compile-structured "$source" --out "$output" --capability interop.dotnet.math-i64 > artifacts/denied/diagnostic.txt 2>&1; then
              echo "unauthorized source unexpectedly compiled: $source" >&2
              exit 1
            fi
            test ! -e "$output"
            case "$source" in
              *file.atto|*shadow.atto) grep -q DOTNET_IMPORT_UNSUPPORTED artifacts/denied/diagnostic.txt ;;
              *overload.atto) grep -q 'requires int operands' artifacts/denied/diagnostic.txt ;;
            esac
          done
          # Positive input must fail without the grant, before emitting CIL.
          rm -f "$output"
          if "$compiler" compile-structured examples/interop/dotnet-math-abs.atto --out "$output" > artifacts/denied/diagnostic.txt 2>&1; then
            echo 'import compiled without capability' >&2
            exit 1
          fi
          test ! -e "$output"
          grep -q DOTNET_INTEROP_CAPABILITY_DENIED artifacts/denied/diagnostic.txt
          echo 'DOTNET_IMPORT_NATIVE_DENIALS_EXECUTED|cases=4|cil=none'
      - name: Execute both independent native guest binaries and verify output
        shell: bash
        run: |
          set -Eeuo pipefail
          binary=artifacts/dotnetimport/linux-x64/oreslang-app
          file "$binary"
          readelf -h "$binary" >/dev/null
          nested=artifacts/dotnetnested/linux-x64/oreslang-app
          file "$nested"
          readelf -h "$nested" >/dev/null
          output="$("$binary")"
          test "$output" = '42'
          nested_output="$("$nested")"
          test "$nested_output" = '42'
          test "$("$binary")" = '42' # no stale CIL cross-contamination
          sha256sum "$binary" "$nested" artifacts/compiler/linux-x64/oresnet artifacts/generated/linux-x64/OresGenerated.dll
          git rev-parse HEAD
          git status --porcelain
          echo 'DOTNET_IMPORT_NATIVE_AOT_EXECUTED|abs=42|nested=42'

  native-aot-import-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout exactly the reviewed source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject a stale or modified checkout before publication
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_HEAD) {
            throw "Wrong source HEAD: expected $env:EXPECTED_HEAD, got $actual"
          }
          if (@(git status --porcelain --untracked-files=all).Count -ne 0) {
            throw 'Source checkout was dirty before Windows NativeAOT admission'
          }
          Write-Host "DOTNET_IMPORT_WIN_EXACT_SOURCE_HEAD=$actual"
          git rev-parse 'HEAD^{tree}'
      - name: Install pinned .NET SDK 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute actual managed compiler and CIL verifier tests
        shell: pwsh
        run: |
          dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT imported library verifier failed' }
      - name: Publish and execute native Windows Abs guest
        shell: pwsh
        run: |
          ./scripts/publish-windows.ps1 -Source examples/interop/dotnet-math-abs.atto -Rid win-x64 -Output artifacts/dotnetimport -Structured -InteropMathI64
          $binary = 'artifacts/dotnetimport/win-x64/oreslang-app.exe'
          ./verification/assert-native-release.ps1 -Binary $binary -Rid win-x64
          $output = (& $binary | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $output -cne '42') {
            throw "NativeAOT Abs returned '$output' rather than 42"
          }
          Write-Host 'DOTNET_IMPORT_WIN_ABS_EXECUTED=42'
      - name: Publish and execute independently linked nested native guest
        shell: pwsh
        run: |
          ./scripts/publish-windows.ps1 -Source examples/interop/dotnet-math-nested.atto -Rid win-x64 -Output artifacts/dotnetnested -Structured -InteropMathI64
          $binary = 'artifacts/dotnetnested/win-x64/oreslang-app.exe'
          ./verification/assert-native-release.ps1 -Binary $binary -Rid win-x64
          $output = (& $binary | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $output -cne '42') {
            throw "NativeAOT nested Min/Max/Abs returned '$output' rather than 42"
          }
          $previous = 'artifacts/dotnetimport/win-x64/oreslang-app.exe'
          $again = (& $previous | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $again -cne '42') {
            throw 'Second publish contaminated the first NativeAOT imported application'
          }
          Write-Host 'DOTNET_IMPORT_WIN_NESTED_EXECUTED=42'
      - name: Refuse three unauthorized host imports in native compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $compiler = 'artifacts/compiler/win-x64/oresnet.exe'
          $out = 'artifacts/denied/OresGenerated.dll'
          New-Item -ItemType Directory -Force (Split-Path $out -Parent) | Out-Null
          $fixtures = @(
            'examples/interop/reject-unauthorized-file.atto',
            'examples/interop/reject-math-overload.atto',
            'examples/interop/reject-alias-shadow.atto'
          )
          foreach ($source in $fixtures) {
            Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue
            $diagnostic = (& $compiler compile-structured $source --out $out --capability interop.dotnet.math-i64 2>&1 | Out-String)
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0 -or (Test-Path -LiteralPath $out)) {
              throw "NativeAOT compiler accepted invalid host import '$source'"
            }
            if ($diagnostic -notmatch 'DOTNET_IMPORT_UNSUPPORTED|requires int operands') {
              throw "Host import rejection lacked audited diagnostic: $diagnostic"
            }
          }
          Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue
          $diagnostic = (& $compiler compile-structured examples/interop/dotnet-math-abs.atto --out $out 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0 -or (Test-Path -LiteralPath $out) -or $diagnostic -notmatch 'DOTNET_INTEROP_CAPABILITY_DENIED') {
            throw 'Host import without explicit capability did not fail closed'
          }
          $global:LASTEXITCODE = 0
          Write-Host 'DOTNET_IMPORT_WIN_DENIALS_EXECUTED=4'
      - name: Emit exact source tree and actual Windows native artifact hashes
        shell: pwsh
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          foreach ($path in @(
            'artifacts/compiler/win-x64/oresnet.exe',
            'artifacts/dotnetimport/win-x64/oreslang-app.exe',
            'artifacts/dotnetnested/win-x64/oreslang-app.exe'
          )) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing native artifact: $path" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "DOTNET_IMPORT_WIN_NATIVE_SHA256=$path $hash"
          }
          Write-Host 'DOTNET_IMPORT_WINDOWS_NATIVE_AOT_EXECUTED|abs=42|nested=42|denials=4'
