name: Structural parity contract audit
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-contract-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject omitted cases and evidence inflation
        run: python3 scripts/check-structural-parity.py --self-test
      - name: Verify pinned shared contract (not a feature parity claim)
        run: python3 scripts/check-structural-parity.py --check
      - name: Verify byte-pinned structural positional tuple v2 target cases
        run: python3 scripts/check-structural-v2.py --check
      - name: Reject malformed, omitted and promoted structural v2 cases
        run: python3 scripts/check-structural-v2.py --self-test
      - name: Prove structural v2 cannot falsely claim runtime parity
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/check-structural-v2.py --require-parity > /tmp/structural-v2-status.txt 2>&1; then
            echo "Target-only v2 was incorrectly promoted to feature parity"
            exit 1
          fi
          grep -Fq 'NOT AT PARITY' /tmp/structural-v2-status.txt
      - name: Assert exact checked-out source commit
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
      - name: Check pinned structural array/list/map v3 target-only corpus
        run: python3 -I scripts/check-structural-containers-v3.py --check
      - name: Reject forged v3 collection cases, bounds and backend lists
        run: python3 -I scripts/check-structural-containers-v3.py --self-test
      - name: Prove v3 inventory cannot falsely claim runtime parity
        shell: bash
        run: |
          set -euo pipefail
          if python3 -I scripts/check-structural-containers-v3.py --require-parity > /tmp/structural-v3-status.txt 2>&1; then
            echo "Target-only v3 was incorrectly promoted to feature parity"
            exit 1
          fi
          grep -Fq 'NOT AT PARITY' /tmp/structural-v3-status.txt
