name: .NET contextual import resolver tests (not guest parity)
on:
  pull_request:
    paths:
      - 'compiler/Ores.Net.Compiler.Core/ContextualImportPath.cs'
      - 'verification/Ores.Net.Tests/ContextualImportPathSelfTest.cs'
      - '.github/workflows/contextual-import-path.yml'
      - 'compiler/Ores.Net.Compiler.Core/StructuredSource.cs'
      - 'verification/Ores.Net.Tests/ContextualImportParserSelfTest.cs'
      - 'verification/Ores.Net.Tests/Program.cs'
      - 'compiler/Ores.Net.Compiler.Core/StaticImportGraph.cs'
      - 'verification/Ores.Net.Tests/StaticImportGraphSelfTest.cs'
      - 'compiler/Ores.Net.Compiler.Core/FrozenImportSnapshot.cs'
      - 'verification/Ores.Net.Tests/FrozenImportSnapshotSelfTest.cs'
      - 'compiler/Ores.Net.Compiler.Core/FrozenImportSnapshot.Graph.cs'
      - 'verification/Ores.Net.Tests/FrozenImportGraphSelfTest.cs'
      - 'compiler/Ores.Net.Compiler.Core/FrozenScalarImportCompiler.cs'
      - 'verification/Ores.Net.Tests/FrozenScalarImportSelfTest.cs'
      - 'compiler/Ores.Net.Compiler.Core/FrozenPackageArchive.cs'
      - 'compiler/Ores.Net.Compiler/FrozenPackageCommand.cs'
      - 'compiler/Ores.Net.Compiler/Program.cs'
      - 'verification/frozen-package-cli-fixtures.py'
      - 'compiler/Ores.Net.Compiler.Core/FrozenDependencyGraph.cs'
      - 'verification/Ores.Net.Tests/FrozenDependencyGraphSelfTest.cs'
      - 'compiler/Ores.Net.Compiler.Core/FrozenZipDirectory.cs'
      - 'global.json'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact head and tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD HEAD^{tree}
          git diff --quiet
          test "$(git write-tree)" = "$(git rev-parse HEAD^{tree})"
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile and execute exact resolver source in isolation
        run: |
          set -eu
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          dotnet new console --framework net10.0 --no-restore --output "$work"
          cp compiler/Ores.Net.Compiler.Core/ContextualImportPath.cs "$work/"
          cp verification/Ores.Net.Tests/ContextualImportPathSelfTest.cs "$work/"
          cmp compiler/Ores.Net.Compiler.Core/ContextualImportPath.cs "$work/ContextualImportPath.cs"
          cmp verification/Ores.Net.Tests/ContextualImportPathSelfTest.cs "$work/ContextualImportPathSelfTest.cs"
          cp compiler/Ores.Net.Compiler.Core/StaticImportGraph.cs "$work/"
          cp verification/Ores.Net.Tests/StaticImportGraphSelfTest.cs "$work/"
          cp compiler/Ores.Net.Compiler.Core/FrozenImportSnapshot.cs "$work/"
          cp verification/Ores.Net.Tests/FrozenImportSnapshotSelfTest.cs "$work/"
          cmp compiler/Ores.Net.Compiler.Core/FrozenImportSnapshot.cs "$work/FrozenImportSnapshot.cs"
          cmp verification/Ores.Net.Tests/FrozenImportSnapshotSelfTest.cs "$work/FrozenImportSnapshotSelfTest.cs"
          cmp compiler/Ores.Net.Compiler.Core/StaticImportGraph.cs "$work/StaticImportGraph.cs"
          cmp verification/Ores.Net.Tests/StaticImportGraphSelfTest.cs "$work/StaticImportGraphSelfTest.cs"
          dotnet run --project "$work" --configuration Release
      - name: Compile actual compiler project
        run: dotnet build compiler/Ores.Net.Compiler.Core/Ores.Net.Compiler.Core.csproj -c Release
      - name: Run production source module compiler import tests
        run: |
          set -eu
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          dotnet new console --framework net10.0 --no-restore --output "$work"
          dotnet add "$work" reference "$PWD/compiler/Ores.Net.Compiler.Core/Ores.Net.Compiler.Core.csproj"
          cp verification/Ores.Net.Tests/ContextualImportParserSelfTest.cs "$work/"
          cmp verification/Ores.Net.Tests/ContextualImportParserSelfTest.cs "$work/ContextualImportParserSelfTest.cs"
          cp verification/Ores.Net.Tests/FrozenImportGraphSelfTest.cs "$work/"
          cmp verification/Ores.Net.Tests/FrozenImportGraphSelfTest.cs "$work/FrozenImportGraphSelfTest.cs"
          cp verification/Ores.Net.Tests/FrozenDependencyGraphSelfTest.cs "$work/"
          cmp verification/Ores.Net.Tests/FrozenDependencyGraphSelfTest.cs "$work/FrozenDependencyGraphSelfTest.cs"
          printf '%s\n' 'ContextualImportParserSelfTest.Run();' 'FrozenImportGraphSelfTest.Run();' 'FrozenDependencyGraphSelfTest.Run();' > "$work/Program.cs"
          dotnet run --project "$work" --configuration Release
      - name: Check real frozen CLI and atomic output on tampering
        run: |
          set -eu
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          python3 verification/frozen-package-cli-fixtures.py "$work"
          pin="$(cat "$work/pin")"
          project=compiler/Ores.Net.Compiler/Ores.Net.Compiler.csproj
          dotnet build "$project" -c Release
          cli() { dotnet run --no-build -c Release --project "$project" -- "$@"; }
          cli check-frozen "$work/main.atto" --package "$work/good.zip" @org/project/package 1.0.0 "$pin"
          cli compile-frozen "$work/main.atto" --package "$work/good.zip" @org/project/package 1.0.0 "$pin" --out "$work/OresGenerated.dll"
          cp "$work/OresGenerated.dll" "$work/baseline.dll"
          for fixture in tampered traversal extra duplicate no-lock oversized truncated trailing central-name central-offset central-crc central-count; do
            if cli compile-frozen "$work/main.atto" --package "$work/$fixture.zip" @org/project/package 1.0.0 "$pin" --out "$work/OresGenerated.dll"; then
              echo "unexpected archive admission: $fixture"; exit 1
            fi
            cmp "$work/baseline.dll" "$work/OresGenerated.dll"
          done
          if cli compile-frozen "$work/main.atto" --package "$work/good.zip" @org/project/package 1.0.0 "$(printf '%064d' 0)" --out "$work/OresGenerated.dll"; then exit 1; fi
          if cli compile-frozen "$work/missing.atto" --package "$work/good.zip" @org/project/package 1.0.0 "$pin" --out "$work/OresGenerated.dll"; then exit 1; fi
          cmp "$work/baseline.dll" "$work/OresGenerated.dll"
          if cli check-frozen "$work/main.atto" --package "$work/good.zip" @org/project/package 1.0.0 "$pin" --capability interop.dotnet.math-i64; then exit 1; fi
          echo "FROZEN_CLI|check=pass|compile=pass|negative-output-preserved"
      - name: Emit frozen scalar guest and execute static NativeAOT host
        run: |
          set -eu
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          dotnet new console --framework net10.0 --no-restore --output "$work/emitter"
          dotnet add "$work/emitter" reference "$PWD/compiler/Ores.Net.Compiler.Core/Ores.Net.Compiler.Core.csproj"
          cp verification/Ores.Net.Tests/FrozenScalarImportSelfTest.cs "$work/emitter/"
          cmp verification/Ores.Net.Tests/FrozenScalarImportSelfTest.cs "$work/emitter/FrozenScalarImportSelfTest.cs"
          cp verification/Ores.Net.Tests/FrozenDependencyGraphSelfTest.cs "$work/emitter/"
          cmp verification/Ores.Net.Tests/FrozenDependencyGraphSelfTest.cs "$work/emitter/FrozenDependencyGraphSelfTest.cs"
          printf '%s\n' 'FrozenScalarImportSelfTest.Run(args[0]);' 'FrozenDependencyGraphSelfTest.EmitTransitiveGuest(args[0]+".transitive.dll");' 'FrozenDependencyGraphSelfTest.EmitSessionGuests(args[0]+".session");' 'FrozenDependencyGraphSelfTest.EmitNamespaceGuest(args[0]+".namespace.dll");' > "$work/emitter/Program.cs"
          dotnet run --project "$work/emitter" --configuration Release -- "$work/OresGenerated.dll"
          sha256sum "$work/OresGenerated.dll"
          mkdir "$work/host"
          cat > "$work/host/FrozenGuest.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <PublishAot>true</PublishAot>
              <InvariantGlobalization>true</InvariantGlobalization>
            </PropertyGroup>
            <ItemGroup>
              <Reference Include="OresGenerated">
                <HintPath>../OresGenerated.dll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          EOF
          printf '%s\n' 'long value = Oreslang.Generated.OresProgram.Run();' 'System.Console.WriteLine(value);' 'return value == 42 ? 0 : 1;' > "$work/host/Program.cs"
          dotnet publish "$work/host/FrozenGuest.csproj" -c Release -r linux-x64 -o "$work/native"
          file "$work/native/FrozenGuest"
          test "$("$work/native/FrozenGuest")" = 42
          echo "FROZEN_NATIVEAOT_GUEST|result=42|static-reference|no-reflection"
          sha256sum "$work/OresGenerated.dll.args.dll"
          mkdir "$work/args"
          cp "$work/OresGenerated.dll.args.dll" "$work/args/OresGenerated.dll"
          cmp "$work/OresGenerated.dll.args.dll" "$work/args/OresGenerated.dll"
          mkdir "$work/args/host"
          cp "$work/host/FrozenGuest.csproj" "$work/host/Program.cs" "$work/args/host/"
          dotnet publish "$work/args/host/FrozenGuest.csproj" -c Release -r linux-x64 -o "$work/args/native"
          file "$work/args/native/FrozenGuest"
          test "$("$work/args/native/FrozenGuest")" = 42
          echo "FROZEN_NATIVEAOT_ARGS_GUEST|result=42|static-reference|no-reflection"
          for index in 0 1 2 3; do
            root="$work/expr$index"
            mkdir -p "$root/host"
            cp "$work/OresGenerated.dll.expr$index.dll" "$root/OresGenerated.dll"
            cmp "$work/OresGenerated.dll.expr$index.dll" "$root/OresGenerated.dll"
            sha256sum "$root/OresGenerated.dll"
            cp "$work/host/FrozenGuest.csproj" "$work/host/Program.cs" "$root/host/"
            dotnet publish "$root/host/FrozenGuest.csproj" -c Release -r linux-x64 -o "$root/native"
            file "$root/native/FrozenGuest"
            test "$("$root/native/FrozenGuest")" = 42
            echo "FROZEN_NATIVEAOT_EXPR_GUEST|index=$index|result=42|static-reference|no-reflection"
          done
          for index in 0 1 2 3; do
            root="$work/multi$index"
            mkdir -p "$root/host"
            cp "$work/OresGenerated.dll.multi$index.dll" "$root/OresGenerated.dll"
            cmp "$work/OresGenerated.dll.multi$index.dll" "$root/OresGenerated.dll"
            sha256sum "$root/OresGenerated.dll"
            cp "$work/host/FrozenGuest.csproj" "$work/host/Program.cs" "$root/host/"
            dotnet publish "$root/host/FrozenGuest.csproj" -c Release -r linux-x64 -o "$root/native"
            file "$root/native/FrozenGuest"
            test "$("$root/native/FrozenGuest")" = 42
            echo "FROZEN_NATIVEAOT_MULTI_GUEST|index=$index|result=42|static-reference|no-reflection"
          done



          root="$work/transitive"
          mkdir -p "$root/host"
          cp "$work/OresGenerated.dll.transitive.dll" "$root/OresGenerated.dll"
          cmp "$work/OresGenerated.dll.transitive.dll" "$root/OresGenerated.dll"
          sha256sum "$root/OresGenerated.dll"
          cp "$work/host/FrozenGuest.csproj" "$work/host/Program.cs" "$root/host/"
          dotnet publish "$root/host/FrozenGuest.csproj" -c Release -r linux-x64 -o "$root/native"
          file "$root/native/FrozenGuest"
          test "$("$root/native/FrozenGuest")" = 42
          echo "FROZEN_NATIVEAOT_TRANSITIVE_GUEST|result=42|three-authenticated-packages"
          for variant in warm changed; do
            root="$work/session-$variant"
            expected=42
            if [ "$variant" = changed ]; then expected=43; fi
            mkdir -p "$root/host"
            cp "$work/OresGenerated.dll.session.$variant.dll" "$root/OresGenerated.dll"
            cmp "$work/OresGenerated.dll.session.$variant.dll" "$root/OresGenerated.dll"
            sha256sum "$root/OresGenerated.dll"
            cp "$work/host/FrozenGuest.csproj" "$root/host/"
            printf '%s\n' 'long value = Oreslang.Generated.OresProgram.Run();' 'System.Console.WriteLine(value);' "return value == $expected ? 0 : 1;" > "$root/host/Program.cs"
            dotnet publish "$root/host/FrozenGuest.csproj" -c Release -r linux-x64 -o "$root/native"
            file "$root/native/FrozenGuest"
            test "$("$root/native/FrozenGuest")" = "$expected"
            echo "FROZEN_NATIVEAOT_INCREMENTAL|variant=$variant|result=$expected"
          done
          root="$work/provider-namespace"
          mkdir -p "$root/host"
          cp "$work/OresGenerated.dll.namespace.dll" "$root/OresGenerated.dll"
          cmp "$work/OresGenerated.dll.namespace.dll" "$root/OresGenerated.dll"
          cp "$work/host/FrozenGuest.csproj" "$work/host/Program.cs" "$root/host/"
          dotnet publish "$root/host/FrozenGuest.csproj" -c Release -r linux-x64 -o "$root/native"
          file "$root/native/FrozenGuest"
          test "$("$root/native/FrozenGuest")" = 42
          echo "FROZEN_NATIVEAOT_PROVIDER_NAMESPACE|result=42|three-authenticated-packages"
