name: Trusted .NET Linux Native AOT (source-local exact SHA)

# Manual-only trusted runner definition: this workflow does not accept PR or
# push events. Review and protect main before dispatching a reviewed snapshot.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-net-aot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # TRUST BOUNDARY: never execute a pull_request-defined workflow on this
  # self-hosted runner. Manual dispatch runs trusted workflow YAML from the
  # protected default main branch. Exact source commit AND root tree must
  # be independently approved as repository variables before checkout.
  # No private source is sent to another GitHub organization.
  linux-x64-approved-source-local:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.repository == 'ores-truffle-oreslang/oreslang-source.net' &&
      github.repository_id == '1419704375' &&
      vars.ORESLANG_NET_SELFHOSTED_LINUX == 'enabled' &&
      vars.ORESLANG_NET_SELFHOSTED_LINUX_SHA != '' &&
      vars.ORESLANG_NET_SELFHOSTED_LINUX_TREE != ''
    runs-on:
      group: oreslang-net-aot-trusted
      labels: [self-hosted, Linux, X64, oreslang-net-aot]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Authorize reviewed source before any checkout
        shell: bash
        env:
          APPROVED_HEAD: ${{ vars.ORESLANG_NET_SELFHOSTED_LINUX_SHA }}
          APPROVED_TREE: ${{ vars.ORESLANG_NET_SELFHOSTED_LINUX_TREE }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_REPOSITORY" = ores-truffle-oreslang/oreslang-source.net
          test "$GITHUB_REPOSITORY_ID" = 1419704375
          [[ "$APPROVED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_TREE" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out approved immutable source, not a PR workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ vars.ORESLANG_NET_SELFHOSTED_LINUX_SHA }}
      - name: Confirm exact Git commit, tree, and Native AOT prerequisites
        shell: bash
        env:
          APPROVED_HEAD: ${{ vars.ORESLANG_NET_SELFHOSTED_LINUX_SHA }}
          APPROVED_TREE: ${{ vars.ORESLANG_NET_SELFHOSTED_LINUX_TREE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$APPROVED_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git ls-files --others --exclude-standard)"
          for tool in dotnet clang readelf file realpath sha256sum; do
            command -v "$tool" >/dev/null || { echo "Missing source-local tool: $tool" >&2; exit 1; }
          done
          [[ "$(dotnet --version)" == 10.* ]] || { echo 'Require .NET SDK 10' >&2; exit 1; }
      - name: Run source-free release gates and managed regressions
        shell: bash
        run: |
          set -euo pipefail
          bash verification/assert-linux-native-release-selftest.sh
          node --test verification/ci-evidence-gate.test.mjs verification/linux-native-receipt.test.mjs
          node verification/trusted-source-local-aot-workflow.test.mjs
          dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
      - name: Publish native compiler and three isolated native applications
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object -- contracts/v1/semantics/fixtures/precedence.ores)" = 2d09e697ad4eeac4ee263c3656b92998c67f0bfc
          bash scripts/publish-linux.sh examples/hello.ores
          compiler=artifacts/compiler/linux-x64/oresnet
          if "$compiler" check contracts/scalar/v1/fixtures/reject-actor.ores; then
            echo 'Unsupported actor source admitted' >&2
            exit 1
          fi
          denied=artifacts/rejected/linux-x64/OresGenerated.dll
          mkdir -p "$(dirname "$denied")"
          rm -f -- "$denied"
          if "$compiler" compile contracts/scalar/v1/fixtures/reject-actor.ores --out "$denied"; then
            echo 'Unsupported source generated CIL' >&2
            exit 1
          fi
          test ! -e "$denied"
          bash scripts/publish-linux.sh contracts/v1/semantics/fixtures/add.ores artifacts/parity
          bash scripts/publish-linux.sh contracts/v1/semantics/fixtures/precedence.ores artifacts/parity-precedence
          for binary in artifacts/apps/linux-x64/oreslang-app artifacts/parity/linux-x64/oreslang-app artifacts/parity-precedence/linux-x64/oreslang-app; do
            bash verification/assert-linux-native-release.sh "$binary"
          done
          test "$(artifacts/apps/linux-x64/oreslang-app)" = 14
          test "$(artifacts/parity/linux-x64/oreslang-app)" = 42
          test "$(artifacts/parity-precedence/linux-x64/oreslang-app)" = 40
          echo 'SOURCE_LOCAL_LINUX_NATIVE_AOT_REAL_14_42_40'
      - name: Publish structured CFG as fourth independent Native AOT executable
        shell: bash
        run: |
          set -euo pipefail
          source_file=examples/structured-sum45.ores
          denied=artifacts/rejected-structured/linux-x64/OresGenerated.dll
          compiler=artifacts/compiler/linux-x64/oresnet
          mkdir -p "$(dirname "$denied")"
          rm -f -- "$denied"
          if "$compiler" compile "$source_file" --out "$denied"; then
            echo 'Scalar compiler admitted structured source' >&2
            exit 1
          fi
          test ! -e "$denied"
          "$compiler" check-structured "$source_file"
          bash scripts/publish-linux.sh "$source_file" artifacts/structured --structured
          bash verification/assert-linux-native-release.sh artifacts/structured/linux-x64/oreslang-app
          test "$(artifacts/structured/linux-x64/oreslang-app)" = 45
          test "$(artifacts/apps/linux-x64/oreslang-app)" = 14
          test "$(artifacts/parity/linux-x64/oreslang-app)" = 42
          test "$(artifacts/parity-precedence/linux-x64/oreslang-app)" = 40
          echo 'SOURCE_LOCAL_LINUX_NATIVE_AOT_STRUCTURED_SSA_45_PLUS_14_42_40'
      - name: Execute source-local checked arithmetic with bounded native proofs
        shell: bash
        run: |
          set -euo pipefail
          bash verification/assert-linux-native-arithmetic.sh
          bash verification/assert-linux-native-release.sh artifacts/negative-overflow/linux-x64/oreslang-app
      - name: Write Native AOT evidence bound to approved source commit
        shell: bash
        env:
          EXPECTED_HEAD: ${{ vars.ORESLANG_NET_SELFHOSTED_LINUX_SHA }}
        run: |
          set -euo pipefail
          node verification/write-linux-native-receipt.mjs
      - name: Record source tree and released executable SHA-256 identities
        shell: bash
        env:
          APPROVED_HEAD: ${{ vars.ORESLANG_NET_SELFHOSTED_LINUX_SHA }}
          APPROVED_TREE: ${{ vars.ORESLANG_NET_SELFHOSTED_LINUX_TREE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$APPROVED_TREE"
          mkdir -p artifacts/evidence
          {
            printf 'repository=%s\nworkflow_sha=%s\nworkflow_ref=%s\ntested_source_head=%s\ntested_root_tree=%s\nrun_id=%s\nrun_attempt=%s\ntarget_rid=linux-x64\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" "$APPROVED_HEAD" "$APPROVED_TREE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            sha256sum artifacts/compiler/linux-x64/oresnet artifacts/apps/linux-x64/oreslang-app artifacts/parity/linux-x64/oreslang-app artifacts/parity-precedence/linux-x64/oreslang-app artifacts/structured/linux-x64/oreslang-app artifacts/negative-overflow/linux-x64/oreslang-app
          } > artifacts/evidence/source-local-linux-sha256.txt
      - name: Upload bounded source-local Native AOT receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oreslang-net-source-local-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evidence/source-local-linux-sha256.txt
            artifacts/evidence/linux-native-arithmetic.json
            artifacts/evidence/linux-native-aot.json
          if-no-files-found: error
          retention-days: 14
