name: Source module Native AOT execution
on:
  push:
    branches: ['feat/spin-source-*', 'ci/spin-source-*']
  pull_request:
    paths:
      - 'compiler/**'
      - 'examples/modules/**'
      - 'stdlib/math.ores'
      - 'verification/Ores.Net.Tests/**'
      - 'verification/Ores.Net.ModuleProbe/**'
      - '.github/workflows/source-modules-native-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-modules:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            suffix: ''
          - os: windows-2022
            rid: win-x64
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Existing compiler and module-linking regressions
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_HEAD) { throw 'Checkout identity mismatch' }
          dotnet run -c Release --project verification/Ores.Net.Tests
          if ($LASTEXITCODE -ne 0) { throw 'Compiler/module regressions failed' }
          foreach ($source in (Get-ChildItem examples/modules -Filter '*.ores')) {
            $path = "examples/modules/$($source.Name)"
            if ((git hash-object --no-filters -- $path) -ne (git rev-parse "HEAD:$path")) { throw "Checkout changed source bytes: $path" }
          }
          $mathBlob = git hash-object --no-filters -- stdlib/math.ores
          if ($mathBlob -ne '725309eb0edae4d32ffbfe159b05fc7d4091bcc1' -or
              $mathBlob -ne (git rev-parse 'HEAD:stdlib/math.ores')) {
            throw "Canonical stdlib/math.ores provenance mismatch: $mathBlob"
          }
      - name: Publish native compiler and compile unchanged source graph
        shell: pwsh
        run: |
          dotnet publish compiler/Ores.Net.Compiler -c Release -r '${{ matrix.rid }}' -p:PublishAot=true -o artifacts/module-compiler -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Native compiler publish failed' }
          $compiler = Join-Path 'artifacts/module-compiler' 'oresnet${{ matrix.suffix }}'
          $witness = & $compiler compile-modules examples/modules/main.ores --root examples/modules --out artifacts/module-generated/OresGenerated.dll
          if ($LASTEXITCODE -ne 0) { throw 'Native source graph compilation failed' }
          New-Item artifacts/module-app -ItemType Directory -Force | Out-Null
          $witness | Set-Content artifacts/module-app/source-graph.json
          $witness
          $PSNativeCommandUseErrorActionPreference = $false
          $rejection = & $compiler compile-modules examples/modules/reject-class.ores --root examples/modules --out artifacts/module-rejected/OresGenerated.dll 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $rejection -notmatch 'Nominal class/actor methods require' -or (Test-Path artifacts/module-rejected/OresGenerated.dll)) { throw 'Class rejection was not correctly classified' }
          $rejection
          $global:LASTEXITCODE = 0
      - name: NativeAOT compiler must reject unsafe stdlib imports with no output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path 'artifacts/module-compiler' 'oresnet${{ matrix.suffix }}'
          $root = Join-Path $env:RUNNER_TEMP 'ores-unsafe-nativeaot-negative'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $cases = @(
            @{name='canonical'; path='ores.std/unsafe/ffi'},
            @{name='legacy'; path='std/unsafe/native'},
            @{name='dot-segment'; path='std/./unsafe/memory'},
            @{name='relative'; path='./std/unsafe/ffi'},
            @{name='parent'; path='pkg/../std/unsafe/native'},
            @{name='dotted'; path='std.unsafe.ffi'}
          )
          foreach ($case in $cases) {
            $source = Join-Path $root ($case.name + '.ores')
            $outputDir = Join-Path $root ('out-' + $case.name)
            New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
            $output = Join-Path $outputDir 'OresGenerated.dll'
            $program = 'import module ffi from "' + $case.path + '";' + [Environment]::NewLine + 'pub fnc main():int{return 42;}'
            [System.IO.File]::WriteAllText($source, $program)
            $PSNativeCommandUseErrorActionPreference = $false
            $diagnostic = & $compiler compile-modules $source --root $root --out $output 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 1 -or $diagnostic -notmatch 'unsafe standard-library import unavailable' -or (Test-Path $output)) {
              throw "NativeAOT unsafe admission failed for $($case.name): exit=$exitCode emitted=$(Test-Path $output) diagnostic=$diagnostic"
            }
          }
          $global:LASTEXITCODE = 0
          Write-Host 'PASS NativeAOT compiler G0 unsafe import denial: 6 sources, no emitted DLL'

      - name: Publish and execute statically linked module application
        shell: pwsh
        run: |
          $generated = (Resolve-Path artifacts/module-generated/OresGenerated.dll).Path
          dotnet publish host/Ores.Net.NativeHost -c Release -r '${{ matrix.rid }}' -p:PublishAot=true "-p:GeneratedAssembly=$generated" -o artifacts/module-app -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Native module host publish failed' }
          $binary = Join-Path 'artifacts/module-app' 'oreslang-app${{ matrix.suffix }}'
          $output = & $binary
          if ($LASTEXITCODE -ne 0 -or "$output".Trim() -ne '42') { throw 'Imported native methods did not produce 42' }
          $output
          @{scope='checked-int-bool-module-native-execution-not-full-Spin'; source_commit=(git rev-parse HEAD); source_tree=(git rev-parse 'HEAD^{tree}'); rid='${{ matrix.rid }}'; binary_sha256=(Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant(); output=$output} | ConvertTo-Json | Set-Content artifacts/module-app/receipt.json
      - name: Compile and execute exact canonical stdlib Math
        shell: pwsh
        run: |
          $compiler = Join-Path 'artifacts/module-compiler' 'oresnet${{ matrix.suffix }}'
          $witness = & $compiler compile-modules examples/modules/math-main.ores --root examples/modules --dependency-root stdlib --out artifacts/math-generated/OresGenerated.dll
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Math graph compilation failed' }
          $generated = (Resolve-Path artifacts/math-generated/OresGenerated.dll).Path
          dotnet clean host/Ores.Net.NativeHost -c Release -r '${{ matrix.rid }}' "-p:GeneratedAssembly=$generated"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Math host clean failed' }
          dotnet publish host/Ores.Net.NativeHost -c Release -r '${{ matrix.rid }}' -p:PublishAot=true "-p:GeneratedAssembly=$generated" -o artifacts/math-app -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Math Native AOT publish failed' }
          $binary = Join-Path 'artifacts/math-app' 'oreslang-app${{ matrix.suffix }}'
          $output = & $binary
          if ($LASTEXITCODE -ne 0 -or "$output".Trim() -ne '42') { throw 'Canonical stdlib Math did not produce 42' }
          $witness | Set-Content artifacts/math-app/source-graph.json
          $output
      - name: Exact canonical stdlib Math preserves signed-min overflow
        shell: pwsh
        run: |
          $compiler = Join-Path 'artifacts/module-compiler' 'oresnet${{ matrix.suffix }}'
          & $compiler compile-modules examples/modules/math-overflow.ores --root examples/modules --dependency-root stdlib --out artifacts/math-overflow-generated/OresGenerated.dll
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Math overflow graph compilation failed' }
          $generated = (Resolve-Path artifacts/math-overflow-generated/OresGenerated.dll).Path
          dotnet clean host/Ores.Net.NativeHost -c Release -r '${{ matrix.rid }}' "-p:GeneratedAssembly=$generated"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Math overflow host clean failed' }
          dotnet publish host/Ores.Net.NativeHost -c Release -r '${{ matrix.rid }}' -p:PublishAot=true "-p:GeneratedAssembly=$generated" -o artifacts/math-overflow-app -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Math overflow Native AOT publish failed' }
          $PSNativeCommandUseErrorActionPreference = $false
          $binary = Join-Path 'artifacts/math-overflow-app' 'oreslang-app${{ matrix.suffix }}'
          $output = & $binary 2>&1 | Out-String
          if ($LASTEXITCODE -ne 70 -or $output -notmatch 'Oreslang arithmetic overflow') { throw 'Canonical Math signed-min overflow semantics changed' }
          $output
          $global:LASTEXITCODE = 0
      - name: Imported helper preserves checked overflow
        shell: pwsh
        run: |
          $compiler = Join-Path 'artifacts/module-compiler' 'oresnet${{ matrix.suffix }}'
          & $compiler compile-modules examples/modules/overflow.ores --root examples/modules --out artifacts/module-overflow-generated/OresGenerated.dll
          if ($LASTEXITCODE -ne 0) { throw 'Overflow graph compilation failed' }
          $generated = (Resolve-Path artifacts/module-overflow-generated/OresGenerated.dll).Path
          dotnet clean host/Ores.Net.NativeHost -c Release -r '${{ matrix.rid }}' "-p:GeneratedAssembly=$generated"
          if ($LASTEXITCODE -ne 0) { throw 'Native host clean failed' }
          dotnet publish host/Ores.Net.NativeHost -c Release -r '${{ matrix.rid }}' -p:PublishAot=true "-p:GeneratedAssembly=$generated" -o artifacts/module-overflow-app -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Overflow host publish failed' }
          $PSNativeCommandUseErrorActionPreference = $false
          $binary = Join-Path 'artifacts/module-overflow-app' 'oreslang-app${{ matrix.suffix }}'
          $output = & $binary 2>&1 | Out-String
          if ($LASTEXITCODE -ne 70 -or $output -notmatch 'Oreslang arithmetic overflow') { throw 'Imported arithmetic overflow semantics changed' }
          $output
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-modules-${{ matrix.rid }}
          path: artifacts/module-app/
