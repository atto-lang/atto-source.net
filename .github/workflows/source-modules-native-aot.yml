name: Source module Native AOT execution
on:
  push:
    branches: ['feat/spin-source-*', 'ci/spin-source-*']
  pull_request:
    paths:
      - 'compiler/**'
      - 'examples/modules/**'
      - 'library/ores.core/**'
      - 'verification/Ores.Net.Tests/**'
      - 'verification/Ores.Net.ModuleProbe/**'
      - '.github/workflows/source-modules-native-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-modules:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            suffix: ''
          - os: windows-2022
            rid: win-x64
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Existing compiler and module-linking regressions
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_HEAD) { throw 'Checkout identity mismatch' }
          dotnet run -c Release --project verification/Ores.Net.Tests
          if ($LASTEXITCODE -ne 0) { throw 'Compiler/module regressions failed' }
          foreach ($source in (Get-ChildItem examples/modules -Filter '*.ores')) {
            $path = "examples/modules/$($source.Name)"
            if ((git hash-object --no-filters -- $path) -ne (git rev-parse "HEAD:$path")) { throw "Checkout changed source bytes: $path" }
          }
      - name: Publish native compiler and compile unchanged source graph
        shell: pwsh
        run: |
          dotnet publish compiler/Ores.Net.Compiler -c Release -r '${{ matrix.rid }}' -p:PublishAot=true -o artifacts/module-compiler -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Native compiler publish failed' }
          $compiler = Join-Path 'artifacts/module-compiler' 'oresnet${{ matrix.suffix }}'
          $witness = & $compiler compile-modules examples/modules/main.ores --root examples/modules --out artifacts/module-generated/OresGenerated.dll
          if ($LASTEXITCODE -ne 0) { throw 'Native source graph compilation failed' }
          New-Item artifacts/module-app -ItemType Directory -Force | Out-Null
          $witness | Set-Content artifacts/module-app/source-graph.json
          $witness
          $PSNativeCommandUseErrorActionPreference = $false
          $rejection = & $compiler compile-modules examples/modules/reject-class.ores --root examples/modules --out artifacts/module-rejected/OresGenerated.dll 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $rejection -notmatch 'Nominal class/actor methods require' -or (Test-Path artifacts/module-rejected/OresGenerated.dll)) { throw 'Class rejection was not correctly classified' }
          $rejection
          $global:LASTEXITCODE = 0
      - name: Publish and execute statically linked module application
        shell: pwsh
        run: |
          $generated = (Resolve-Path artifacts/module-generated/OresGenerated.dll).Path
          dotnet publish host/Ores.Net.NativeHost -c Release -r '${{ matrix.rid }}' -p:PublishAot=true "-p:GeneratedAssembly=$generated" -o artifacts/module-app -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Native module host publish failed' }
          $binary = Join-Path 'artifacts/module-app' 'oreslang-app${{ matrix.suffix }}'
          $output = & $binary
          if ($LASTEXITCODE -ne 0 -or "$output".Trim() -ne '42') { throw 'Imported native methods did not produce 42' }
          $output
          @{scope='checked-int-bool-module-native-execution-not-full-Spin'; source_commit=(git rev-parse HEAD); source_tree=(git rev-parse 'HEAD^{tree}'); rid='${{ matrix.rid }}'; binary_sha256=(Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant(); output=$output} | ConvertTo-Json | Set-Content artifacts/module-app/receipt.json
      - name: Imported helper preserves checked overflow
        shell: pwsh
        run: |
          $compiler = Join-Path 'artifacts/module-compiler' 'oresnet${{ matrix.suffix }}'
          & $compiler compile-modules examples/modules/overflow.ores --root examples/modules --out artifacts/module-overflow-generated/OresGenerated.dll
          if ($LASTEXITCODE -ne 0) { throw 'Overflow graph compilation failed' }
          $generated = (Resolve-Path artifacts/module-overflow-generated/OresGenerated.dll).Path
          dotnet clean host/Ores.Net.NativeHost -c Release -r '${{ matrix.rid }}' "-p:GeneratedAssembly=$generated"
          if ($LASTEXITCODE -ne 0) { throw 'Native host clean failed' }
          dotnet publish host/Ores.Net.NativeHost -c Release -r '${{ matrix.rid }}' -p:PublishAot=true "-p:GeneratedAssembly=$generated" -o artifacts/module-overflow-app -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Overflow host publish failed' }
          $PSNativeCommandUseErrorActionPreference = $false
          $binary = Join-Path 'artifacts/module-overflow-app' 'oreslang-app${{ matrix.suffix }}'
          $output = & $binary 2>&1 | Out-String
          if ($LASTEXITCODE -ne 70 -or $output -notmatch 'Oreslang arithmetic overflow') { throw 'Imported arithmetic overflow semantics changed' }
          $output
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-modules-${{ matrix.rid }}
          path: artifacts/module-app/

      - name: Compile canonical Oreslang core and execute Native AOT
        shell: pwsh
        run: |
          $expected = '3d1d7b77068dd02b3d60b30b72f29a4537a933134ca79e1e81df096dc56f5f33'
          $actual = (Get-FileHash library/ores.core/numeric.ores -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Canonical core source drift' }
          if ((git hash-object --no-filters -- library/ores.core/numeric.ores) -ne (git rev-parse 'HEAD:library/ores.core/numeric.ores')) { throw 'Committed core source changed in checkout' }
          $compiler = Join-Path 'artifacts/module-compiler' 'oresnet${{ matrix.suffix }}'
          $raw = & $compiler compile-modules examples/modules/core-numeric.ores --root examples/modules --out artifacts/native-core-generated/OresGenerated.dll
          if ($LASTEXITCODE -ne 0) { throw 'Canonical .ores core typed CIL compilation failed' }
          $witness = $raw | ConvertFrom-Json
          if ($witness.scope -ne 'verified-int-bool-modules-not-full-Spin' -or
              $witness.graph_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid typed module graph witness' }
          $units = @($witness.sources)
          if ($units.Count -ne 2) { throw 'Expected only guest entry and compiler-owned numeric source' }
          $canonical = @($units | Where-Object {
            $_.path -ceq '@ores.core/numeric.ores' -and
            $_.sha256 -ceq $expected -and $_.utf8_bytes -eq 657
          })
          $entry = @($units | Where-Object { $_.path -ceq '0/core-numeric.ores' })
          # Revalidate the guest entry's committed blob immediately before
          # accepting the compiler witness; previous build/test steps must not
          # silently replace the program while preserving a plausible receipt.
          $entryPath = 'examples/modules/core-numeric.ores'
          $observedBlob = git hash-object --no-filters -- $entryPath
          $committedBlob = git rev-parse "HEAD:$entryPath"
          if ($LASTEXITCODE -ne 0 -or $observedBlob -cne $committedBlob) {
            throw 'Canonical guest entry differs from exact checked-out Git blob'
          }
          $entryDigest = (Get-FileHash $entryPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $entryBytes = (Get-Item examples/modules/core-numeric.ores).Length
          if ($canonical.Count -ne 1 -or $entry.Count -ne 1 -or
              $entry[0].sha256 -cne $entryDigest -or
              $entry[0].utf8_bytes -ne $entryBytes) {
            throw 'Canonical core graph does not match pinned module and unchanged guest entry bytes'
          }
          $raw | Set-Content artifacts/native-core-generated/source-graph.json
          $generated = (Resolve-Path artifacts/native-core-generated/OresGenerated.dll).Path
          dotnet clean host/Ores.Net.NativeHost -c Release -r '${{ matrix.rid }}' "-p:GeneratedAssembly=$generated"
          if ($LASTEXITCODE -ne 0) { throw 'Native host clean failed' }
          dotnet publish host/Ores.Net.NativeHost -c Release -r '${{ matrix.rid }}' -p:PublishAot=true "-p:GeneratedAssembly=$generated" -o artifacts/native-core-app -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Native core host publish failed' }
          $binary = Join-Path 'artifacts/native-core-app' 'oreslang-app${{ matrix.suffix }}'
          $output = & $binary
          if ($LASTEXITCODE -ne 0 -or "$output".Trim() -ne '42') { throw 'Canonical native Oreslang module produced wrong output' }
          @{scope='native-ores-core-numeric-v1'; source_sha256=$actual; graph_sha256=$witness.graph_sha256; source_commit=(git rev-parse HEAD); source_tree=(git rev-parse 'HEAD^{tree}'); rid='${{ matrix.rid }}'; generated_cil_sha256=(Get-FileHash $generated -Algorithm SHA256).Hash.ToLowerInvariant(); binary_sha256=(Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant(); output=$output} | ConvertTo-Json | Set-Content artifacts/native-core-app/core-receipt.json
          $output

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-core-v1-${{ matrix.rid }}
          path: |
            artifacts/native-core-app/core-receipt.json
            artifacts/native-core-generated/source-graph.json
