name: Frozen package and task integration guest
on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'runtime/**'
      - 'host/**'
      - 'ci/test-frozen-task-integration.sh'
      - 'verification/frozen-package-cli-fixtures.py'
      - '.github/workflows/frozen-task-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        profile: [coreclr, macos-arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Exact head compile and run
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git log -1 --format='%H %T'
          bash ci/test-frozen-task-integration.sh "${{ matrix.profile }}"
