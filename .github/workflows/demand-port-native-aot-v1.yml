name: .NET demand port exact-head Native AOT host validation
on:
  pull_request:
    paths:
      - 'runtime/Ores.Net.Runtime/BoundedDemandI64Port.cs'
      - 'verification/Ores.Net.Tests/BoundedDemandI64PortSelfTest.cs'
      - 'verification/Ores.Net.DemandProbe/**'
      - '.github/workflows/demand-port-native-aot-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demand-native-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse 'HEAD^{tree}'
          git hash-object runtime/Ores.Net.Runtime/BoundedDemandI64Port.cs verification/Ores.Net.Tests/BoundedDemandI64PortSelfTest.cs
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Compile and execute actual Native AOT host demand port
        run: |
          set -euo pipefail
          dotnet publish verification/Ores.Net.DemandProbe/Ores.Net.DemandProbe.csproj -c Release -r linux-x64 -o artifacts/demand-native -warnaserror
          test -x artifacts/demand-native/Ores.Net.DemandProbe
          output="$(artifacts/demand-native/Ores.Net.DemandProbe)"
          test "$output" = ATTO_NET_DEMAND_HOST_NATIVE_AOT_PASS
          sha256sum artifacts/demand-native/Ores.Net.DemandProbe
