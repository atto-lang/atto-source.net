name: DOP .NET host graph exact-head verification

on:
  push:
    branches:
      - feat/cpu-gpu-nb-graph-contract-20261016
  workflow_dispatch:

permissions:
  contents: read

jobs:
  net10-host-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned source repository commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit and origin
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git remote get-url origin | sed -E 's#^https://github.com/##; s#\.git$##')" = 'ores-truffle-oreslang/oreslang-source.net'
      - name: Install reviewed .NET 10 toolchain
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Check compiler and managed graph regressions
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
      - name: Report exact-source scope
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)"
          printf 'SOURCE_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          printf '%s\n' 'SCOPE=managed graph importer + bootstrap frontend; no owned-F32 region parity, no device GPU, no Native AOT certification'
