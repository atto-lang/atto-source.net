name: Direct Atto CIL guest NativeAOT conformance
on:
  pull_request:
    paths:
      - "compiler/Atto.Cil.Compiler/**"
      - "tests/Atto.Cil.Guest.Host/**"
      - "tests/Atto.Cil.Float.Guest.Host/**"
      - "fixtures/cil/**"
      - "scripts/test-cil-guest.sh"
      - "scripts/test-named-recursive-cil-guest.sh"
      - "scripts/test-match-cil-guest.sh"
      - "scripts/test-stdio-cil-guest.sh"
      - "scripts/verify-direct-cil-integration.sh"
      - "scripts/test-direct-cil-integrity-harness.sh"
      - "verification/direct-cil-integration-blobs.tsv"
      - "fixtures/match-return-forms-v1/**"
      - ".github/workflows/atto-direct-cil-guest.yml"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-atto-cil-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head and source tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          git rev-parse 'HEAD^{tree}'
      - name: Exercise synthetic exact-Git-blob attack regression suite
        shell: bash
        run: bash scripts/test-direct-cil-integrity-harness.sh
      - name: Verify exact-source integration blob manifest before compilation
        shell: bash
        run: bash scripts/verify-direct-cil-integration.sh
      - name: Install root-pinned .NET 10 SDK and .NET 8 target runtime
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify selected SDK and runtime
        shell: bash
        run: |
          set -euo pipefail
          dotnet --version | grep -E '^10\.'
          dotnet --list-runtimes | grep -F 'Microsoft.NETCore.App 8.'
          dotnet --list-runtimes | grep -F 'Microsoft.NETCore.App 10.'
      - name: Compile and execute real Atto CIL/NativeAOT guest and negatives
        shell: bash
        run: bash scripts/test-cil-guest.sh
      - name: Compile and execute guarded match direct CIL, CoreCLR, NativeAOT guests
        shell: bash
        run: bash scripts/test-match-cil-guest.sh
      - name: Compile and execute original Atto stdout match programs (CoreCLR and NativeAOT)
        shell: bash
        run: bash scripts/test-stdio-cil-guest.sh

      - name: Execute named recursive CIL guests on CoreCLR and NativeAOT
        shell: bash
        run: bash scripts/test-named-recursive-cil-guest.sh
