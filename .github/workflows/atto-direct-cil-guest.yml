name: Direct Atto CIL guest NativeAOT conformance
on:
  pull_request:
    paths:
      - "compiler/Atto.Cil.Compiler/**"
      - "tests/Atto.Cil.Guest.Host/**"
      - "fixtures/cil/**"
      - "scripts/test-cil-guest.sh"
      - "tests/Atto.Cil.Result.Host/**"
      - "scripts/test-result-int-parse-host.sh"
      - ".github/workflows/atto-direct-cil-guest.yml"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-atto-cil-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Print exact source head and Git tree
        shell: bash
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - name: Compile and execute real Atto CIL/NativeAOT guest and negatives
        shell: bash
        run: bash scripts/test-cil-guest.sh
      - name: Execute Result int.parse host-only reference on CoreCLR and NativeAOT
        shell: bash
        run: bash scripts/test-result-int-parse-host.sh
