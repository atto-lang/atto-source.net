name: Continuation locality contract v1
on:
  pull_request:
    paths:
      - "contracts/v2/CONTINUATION_LOCALITY_V1.md"
      - "contracts/v2/test_continuation_locality_v1.py"
      - "src/**"
      - "runtime/**"
      - "tests/**"
      - "verification/**"
      - ".github/workflows/continuation-locality-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA" || exit 1
          git rev-parse HEAD
      - name: Run host-only reference policy checks (NOT guest parity)
        run: python3 -m unittest -v contracts/v2/test_continuation_locality_v1.py
  host-net-actor-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj --configuration Release
