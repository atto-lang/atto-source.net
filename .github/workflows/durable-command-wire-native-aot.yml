name: .NET event-sourced command wire Native AOT host proof
on:
  pull_request:
    paths:
      - 'runtime/Ores.Net.Runtime/DurableCommandWireV1.cs'
      - 'verification/Ores.Net.DurableCommandProbe/**'
      - 'docs/EVENT_SOURCING_COMMAND_WIRE_V1.md'
      - '.github/workflows/durable-command-wire-native-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-aot-host:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            binary: Ores.Net.DurableCommandProbe
          - os: windows-2022
            rid: win-x64
            binary: Ores.Net.DurableCommandProbe.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Check exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse 'HEAD^{tree}'
          git ls-files -s runtime/Ores.Net.Runtime/DurableCommandWireV1.cs verification/Ores.Net.DurableCommandProbe/Program.cs
      - name: Publish and execute actual Native AOT host codec
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/event-sourcing-native-aot"
          dotnet publish verification/Ores.Net.DurableCommandProbe/Ores.Net.DurableCommandProbe.csproj \
            -c Release -r "$RID" -p:PublishAot=true -p:SelfContained=true -o "$destination"
          test -f "$destination/$BINARY"
          "$destination/$BINARY" | tee "$RUNNER_TEMP/durable-host-wire.log"
          grep -Fx 'NET_NATIVEAOT_HOST_DURABLE_COMMAND_WIRE_V1_PASS|guest=0|durable=0' "$RUNNER_TEMP/durable-host-wire.log"
