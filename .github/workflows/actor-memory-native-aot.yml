name: Actor memory runtime and NativeAOT
on:
  pull_request:
    paths:
      - 'runtime/Ores.Net.Runtime/**'
      - 'verification/Ores.Net.Tests/**'
      - 'verification/Ores.Net.ActorMemoryProbe/**'
      - 'contracts/actor-scalar-execution-v1/**'
      - '.github/workflows/actor-memory-native-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actor-memory:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            binary: Ores.Net.ActorMemoryProbe
          - os: windows-2022
            rid: win-x64
            binary: Ores.Net.ActorMemoryProbe.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Exact source identity and existing full verification runner
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          git rev-parse 'HEAD^{tree}'
          dotnet --info
          dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release | tee "$RUNNER_TEMP/actor-managed-tests.log"
          grep -Fx 'PASS actor scalar frame ABI v1 host/compiler-boundary tests (NOT guest execution)' "$RUNNER_TEMP/actor-managed-tests.log"
          grep -Fx 'PASS net-frame-reissue-integrated: 128 rounds|zeroed=1|stale=denied|native_refund=1' "$RUNNER_TEMP/actor-managed-tests.log"
          grep -Fx 'PASS .NET terminal compiled guest-frame boundary host tests (NOT guest .atto or physical stack proof)' "$RUNNER_TEMP/actor-managed-tests.log"
          grep -Fx 'PASS net-actor-guest-frame-eight-fault-matrix|faults=8|peer=42|admission=9|guest_atto=0' "$RUNNER_TEMP/actor-managed-tests.log"
          grep -Fx 'PASS net-source-cfg-actor-frames-v1|source=3|faults=3|peer=42|loop=42|fuel=bounded|native_refund=1|guest_machine_code=0' "$RUNNER_TEMP/actor-managed-tests.log"
      - name: Publish and execute actual host actor NativeAOT isolation probe
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/actor-memory-aot"
          dotnet publish verification/Ores.Net.ActorMemoryProbe/Ores.Net.ActorMemoryProbe.csproj -c Release -r "$RID" -p:PublishAot=true -p:SelfContained=true -o "$output"
          test -f "$output/$BINARY"
          "$output/$BINARY" | tee "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-memory-survivor: same-pool peer reads and writes during pinned STOP and after physical reclaim' "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-memory-native-probe: four private heaps (two shared-pool actors), foreign handles denied, pooled carriers, stale context denied, pinned STOP and physical reclaim' "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-logical-stack-native-probe: four distinct actor-owned frames, cross-turn reads and foreign-handle denial' "$RUNNER_TEMP/actor-memory-native.log"
