name: Actor memory runtime and NativeAOT
on:
  pull_request:
    paths:
      - 'runtime/Ores.Net.Runtime/**'
      - 'compiler/Ores.Net.Compiler.Core/**'
      - 'verification/Ores.Net.Tests/**'
      - 'verification/Ores.Net.ActorMemoryProbe/**'
      - 'scripts/test-actor-io-host.sh'
      - '.github/workflows/actor-memory-native-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actor-memory:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            binary: Ores.Net.ActorMemoryProbe
          - os: windows-2022
            rid: win-x64
            binary: Ores.Net.ActorMemoryProbe.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Strict build and exact-head actor host regression receipts
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bash scripts/test-actor-io-host.sh | tee "$RUNNER_TEMP/actor-host-evidence.log"
          grep -Fx 'ACTOR_IO_HOST_EXACT_HEAD_TESTS_EXECUTED_PASS' "$RUNNER_TEMP/actor-host-evidence.log"
          # These are host/reference tests, NOT compiled Atto actor guests.
          dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release | tee "$RUNNER_TEMP/actor-guest-host-evidence.log"
          grep -Fx 'PASS actor-ref32-owned-auth: per-actor handles deny cross-actor aliasing, stale reads and foreign links (host only)' "$RUNNER_TEMP/actor-guest-host-evidence.log"
          grep -Fx 'PASS actor-heap-java-parity: managed GC, tenant isolation and forged native no-GC claims fail closed (host only)' "$RUNNER_TEMP/actor-guest-host-evidence.log"
          grep -Fx 'PASS actor-ref32-cycle-reclaim: cyclic typed guest links do not retain native arena past final read loan (host only)' "$RUNNER_TEMP/actor-guest-host-evidence.log"
          grep -Fx 'PASS actor-guest-demand-backed-ref32: first guest allocation charges physical native storage and actor stop refunds it (host only)' "$RUNNER_TEMP/actor-guest-host-evidence.log"
      - name: Publish and execute actual host actor NativeAOT isolation probe
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/actor-memory-aot"
          dotnet publish verification/Ores.Net.ActorMemoryProbe/Ores.Net.ActorMemoryProbe.csproj -c Release -r "$RID" -p:PublishAot=true -p:SelfContained=true -o "$output"
          test -f "$output/$BINARY"
          "$output/$BINARY" | tee "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-memory-survivor: same-pool peer reads and writes during pinned STOP and after physical reclaim' "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-memory-native-probe: four private heaps (two shared-pool actors), foreign handles denied, pooled carriers, stale context denied, pinned STOP and physical reclaim' "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-logical-stack-native-probe: four actor-private heaps, per-receive stack cleanup and foreign-handle denial' "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-scalar-sealed-schema-native-probe: immutable i64/bool layout, forged tags, block counts and stale receive frames denied; NOT compiled .atto' "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-scalar-nativeaot-parallel-transfer: i64 swap is simultaneous, malformed second destination is failure-atomic; NOT compiled .atto' "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-stack-nativeaot-terminal-quota: depth, aggregate bytes, oversized frame all terminal after catch; sibling survives; no native budget leak; NOT compiled .atto' "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-ref32-native-probe: four actor-local uint32 guest refs, distinct native payloads, retained-turn denial (host only; not compiled guest)' "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-ref32-native-no-clr-allocation: 4096 warmed guest payload cycles allocated zero managed bytes (host only)' "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-ref32-native-typed-nodegraph: four typed native graphs survive actor turns with guarded reference fields (host only; not compiled guest)' "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-ref32-native-typed-no-clr-allocation: 4096 warmed typed I64/ref32 cycles allocated zero managed bytes (host only)' "$RUNNER_TEMP/actor-memory-native.log"
          grep -Fx 'PASS actor-heap-java-parity-nativeaot: unsupported GC and tenant isolation rejected before actor admission (host only)' "$RUNNER_TEMP/actor-memory-native.log"
          sha256sum "$output/$BINARY"
