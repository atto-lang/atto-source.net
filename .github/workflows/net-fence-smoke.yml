name: .NET isolated continuation fence smoke
on:
  pull_request:
    paths:
      - 'runtime/Ores.Net.Runtime/SelectContinuationFence.cs'
      - 'verification/Ores.Net.Fence.Tests/**'
      - 'verification/Ores.Net.Tests/SelectContinuationFenceSelfTest.cs'
      - '.github/workflows/net-fence-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-net-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact originating source tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "FENCE_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "FENCE_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Install .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build isolated fence harness with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          dotnet build verification/Ores.Net.Fence.Tests/Ores.Net.Fence.Tests.csproj -c Release -warnaserror
      - name: Execute 16 independent bounded race-stress rounds
        shell: bash
        run: |
          set -euo pipefail
          for round in $(seq 1 16); do
            output="$(dotnet run --no-build --project verification/Ores.Net.Fence.Tests/Ores.Net.Fence.Tests.csproj -c Release)"
            printf '%s\n' "$output"
            grep -Fxq 'ISOLATED_FENCE_TESTS_PASSED' <<< "$output"
          done
          echo 'FENCE_REPEAT_COUNT=16'
