name: QUIC host admission (not guest parity)
on:
  pull_request:
    paths:
      - 'runtime/Ores.Net.Runtime/Net/**'
      - 'runtime/Ores.Net.Runtime/Properties/AssemblyInfo.cs'
      - 'tools/Ores.Net.QuicAdmissionChecks/**'
      - '.github/workflows/quic-host-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dotnet-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1b5c # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Build AOT-compatible QUIC host primitive and check admission
        run: |
          dotnet build tools/Ores.Net.QuicAdmissionChecks/Ores.Net.QuicAdmissionChecks.csproj -c Release --warnaserror
          dotnet run --project tools/Ores.Net.QuicAdmissionChecks/Ores.Net.QuicAdmissionChecks.csproj -c Release --no-build
