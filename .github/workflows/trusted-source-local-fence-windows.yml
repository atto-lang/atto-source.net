name: Trusted .NET Windows continuation fence (source-local SHA)

# Manual protected-main only; never pull_request or push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-net-fence-${{ github.repository }}
  cancel-in-progress: false

jobs:
  source-local-windows-fence:
    # Opt-in: only a trusted, isolated source-owned runner. No cross-org mirroring.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.repository == 'ores-truffle-oreslang/oreslang-source.net' &&
      github.repository_id == '1419704375' &&
      github.workflow_ref == 'ores-truffle-oreslang/oreslang-source.net/.github/workflows/trusted-source-local-fence-windows.yml@refs/heads/main' &&
      vars.ORESLANG_NET_SELFHOSTED_WINDOWS_FENCE_WORKFLOW_SHA != '' &&
      github.workflow_sha == vars.ORESLANG_NET_SELFHOSTED_WINDOWS_FENCE_WORKFLOW_SHA &&
      vars.ORESLANG_NET_SELFHOSTED_WINDOWS == 'enabled' &&
      vars.ORESLANG_NET_SELFHOSTED_WINDOWS_SHA != '' &&
      vars.ORESLANG_NET_SELFHOSTED_WINDOWS_TREE != ''
    runs-on:
      group: oreslang-net-aot-trusted
      labels: [self-hosted, Windows, X64, oreslang-net-aot]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Authorize protected-main Windows fence snapshot before checkout
        shell: pwsh
        env:
          APPROVED_WORKFLOW_SHA: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_FENCE_WORKFLOW_SHA }}
          APPROVED_HEAD: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_SHA }}
          APPROVED_TREE: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_TREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_REF_PROTECTED -cne 'true' -or
              $env:GITHUB_REPOSITORY -cne 'ores-truffle-oreslang/oreslang-source.net' -or
              $env:GITHUB_REPOSITORY_ID -cne '1419704375' -or
              $env:GITHUB_WORKFLOW_REF -cne 'ores-truffle-oreslang/oreslang-source.net/.github/workflows/trusted-source-local-fence-windows.yml@refs/heads/main' -or
              $env:GITHUB_WORKFLOW_SHA -cne $env:APPROVED_WORKFLOW_SHA) {
            throw 'Refuse untrusted Windows fence workflow event/ref'
          }
          if ($env:APPROVED_WORKFLOW_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:APPROVED_HEAD -cnotmatch '^[0-9a-f]{40}$' -or
              $env:APPROVED_TREE -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Missing independent approval of exact source SHA/tree'
          }
      - name: Checkout immutable approved Windows fence commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_SHA }}
          persist-credentials: false
      - name: Verify SHA and root tree before Windows fence build
        shell: pwsh
        env:
          APPROVED_HEAD: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_SHA }}
          APPROVED_TREE: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_TREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD).Trim()
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:APPROVED_HEAD -or
              $tree -cne $env:APPROVED_TREE) {
            throw 'Windows fence checkout SHA/tree mismatch'
          }
          $dirty = (& git status --porcelain --untracked-files=all | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Dirty source checkout' }
      - name: Install .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build isolated fence harness with warnings as errors
        shell: pwsh
        run: |
          dotnet --info
          if ($LASTEXITCODE -ne 0) { throw 'dotnet SDK unavailable' }
          dotnet build verification/Ores.Net.Fence.Tests/Ores.Net.Fence.Tests.csproj -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Fence test build failed' }
      - name: Execute 16 independent bounded race-stress rounds
        shell: pwsh
        run: |
          for ($round = 1; $round -le 16; $round++) {
            $output = @(dotnet run --no-build --project verification/Ores.Net.Fence.Tests/Ores.Net.Fence.Tests.csproj -c Release)
            if ($LASTEXITCODE -ne 0 -or $output -cnotcontains 'ISOLATED_FENCE_TESTS_PASSED') {
              throw "Fence lifecycle run $round failed or did not emit the exact success marker"
            }
            $output | Write-Output
          }
          Write-Output 'FENCE_REPEAT_COUNT=16'
      - name: Record verified source-bound fence test receipt
        shell: pwsh
        env:
          APPROVED_HEAD: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_SHA }}
          APPROVED_TREE: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_TREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((& git rev-parse HEAD).Trim() -cne $env:APPROVED_HEAD -or
              (& git rev-parse 'HEAD^{tree}').Trim() -cne $env:APPROVED_TREE) {
            throw 'Source changed after the fence tests'
          }
          New-Item -ItemType Directory -Force -Path artifacts/evidence | Out-Null
          [ordered]@{
            schema = 'oreslang.net.windows_fence_source_local_v1'
            repository = $env:GITHUB_REPOSITORY
            workflow_sha = $env:GITHUB_WORKFLOW_SHA
            workflow_ref = $env:GITHUB_WORKFLOW_REF
            tested_source_head = $env:APPROVED_HEAD
            tested_root_tree = $env:APPROVED_TREE
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            test_marker = 'ISOLATED_FENCE_TESTS_PASSED'
            rounds = 16
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath artifacts/evidence/source-local-fence-windows.json
      - name: Upload Windows fence evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oreslang-net-fence-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/source-local-fence-windows.json
          if-no-files-found: error
          retention-days: 14
