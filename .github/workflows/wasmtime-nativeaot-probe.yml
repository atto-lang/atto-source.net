name: .NET Wasmtime real Native AOT probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'verification/Ores.Net.WasmtimeProbe/**'
      - '.github/workflows/wasmtime-nativeaot-probe.yml'
      - 'build/StrictNativeAot.targets'

permissions:
  contents: read

jobs:
  linux-x64-wasmtime-nativeaot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Private repository: a foreign PR head must not be executable under
      # source-org credentials, even when GitHub allows the workflow to start.
      - name: Deny cross-repository checkout before fetching source
        shell: bash
        env:
          SOURCE_REPO: ${{ github.repository }}
          PR_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id || '1419704375' }}
        run: |
          set -euo pipefail
          test "$SOURCE_REPO" = 'ores-truffle-oreslang/oreslang-source.net'
          test "$PR_HEAD_REPO_ID" = '1419704375'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "WASMTIME_TESTED_HEAD=$EXPECTED_HEAD"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Publish real Native AOT host (Wasmtime 50.0.1)
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish verification/Ores.Net.WasmtimeProbe/Ores.Net.WasmtimeProbe.csproj \
            -c Release -r linux-x64 -o "$RUNNER_TEMP/wasmtime-probe" \
            -p:PublishAot=true -p:SelfContained=true
          test -x "$RUNNER_TEMP/wasmtime-probe/oresnet-wasmtime-probe"
          file "$RUNNER_TEMP/wasmtime-probe/oresnet-wasmtime-probe"
      - name: Execute the published native binary (not dotnet run)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wasmtime-probe/oresnet-wasmtime-probe" | tee "$RUNNER_TEMP/wasmtime-probe.log"
          grep -Fx NET_WASMTIME_NATIVEAOT_PROBE_PASS "$RUNNER_TEMP/wasmtime-probe.log"
