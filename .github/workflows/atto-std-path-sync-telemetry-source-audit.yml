name: .NET Atto std/path telemetry sync SOURCE audit (not NativeAOT guest)
on:
  pull_request:
    paths:
      - 'stdlib/path.atto'
      - 'stdlib/sync.atto'
      - 'stdlib/telemetry.atto'
      - 'tests/fixtures/path_sync_telemetry_policy_v1.atto'
      - 'verification/atto-std-path-sync-telemetry-source-audit.mjs'
      - '.github/workflows/atto-std-path-sync-telemetry-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atto-stdlib-policy-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact originating branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify unmodified Git source and tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ATTO_NET_STDLIB_HEAD=$EXPECTED_HEAD"
          echo "ATTO_NET_STDLIB_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Use controlled Node 22 for native Atto source policy checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Execute 65-case fixture coverage and four mutation negatives
        run: |
          set -euo pipefail
          node verification/atto-std-path-sync-telemetry-source-audit.mjs --self-test
      - name: Require source-only check to reject guest execution claims
        shell: bash
        run: |
          set -euo pipefail
          if node verification/atto-std-path-sync-telemetry-source-audit.mjs \
            --require-executed-guest > "$RUNNER_TEMP/std-audit-out" \
            2> "$RUNNER_TEMP/std-audit-err"; then
            echo "::error::Source audit falsely certified NativeAOT guest" >&2
            exit 1
          fi
          grep -Fq 'SOURCE_ONLY: this checker cannot certify linked guest or NativeAOT execution' \
            "$RUNNER_TEMP/std-audit-err"
          echo 'ATTO_NET_STDLIB_GUEST=NOT_EXECUTED'
