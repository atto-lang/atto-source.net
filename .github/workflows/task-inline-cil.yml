name: Inline and scheduled task guest CIL

on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'runtime/Ores.Net.Runtime/**'
      - 'host/**'
      - 'ci/test-task-inline-cil.sh'
      - 'verification/assert-macos-native-release.sh'
      - 'build/StrictNativeAot.targets'
      - 'tests/fixtures/task-inline-cil/**'
      - '.github/workflows/task-inline-cil.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-guest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            profile: coreclr
          - runner: macos-15
            profile: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile and execute exact task guests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git log -1 --format='%H %T'
          bash ci/test-task-inline-cil.sh "${{ matrix.profile }}"
