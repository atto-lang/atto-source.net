name: StateGraph .NET NativeAOT compiler and guest
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  stategraph-native-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Install native C/C++ linker dependencies for NativeAOT
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev binutils file
      - name: Publish real compiler and StateGraph scalar and structured native apps
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/test-stategraph-native-aot.sh
