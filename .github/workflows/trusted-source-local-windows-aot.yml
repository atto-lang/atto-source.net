name: Trusted .NET Windows Native AOT (source-local exact SHA)

# Source-local self-hosted Windows execution is manual-only from protected main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-windows-net-aot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  self-hosted-windows-static-facts:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.repository == 'ores-truffle-oreslang/oreslang-source.net' &&
      github.repository_id == '1419704375' &&
      vars.ORESLANG_NET_SELFHOSTED_WINDOWS == 'enabled' &&
      vars.ORESLANG_NET_SELFHOSTED_WINDOWS_SHA != '' &&
      vars.ORESLANG_NET_SELFHOSTED_WINDOWS_TREE != ''
    runs-on: [self-hosted, Windows, X64, oreslang-net-aot]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Preflight authorized immutable source without checkout
        shell: pwsh
        env:
          APPROVED_HEAD: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_SHA }}
          APPROVED_TREE: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_TREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_REF_PROTECTED -cne 'true' -or
              $env:GITHUB_REPOSITORY -cne 'ores-truffle-oreslang/oreslang-source.net' -or
              $env:GITHUB_REPOSITORY_ID -cne '1419704375') {
            throw 'Untrusted Windows Native AOT workflow'
          }
          if ($env:APPROVED_HEAD -cnotmatch '^[0-9a-f]{40}$' -or
              $env:APPROVED_TREE -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Missing immutable security-reviewed source identity'
          }
      - name: Checkout exact approved commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_SHA }}
          persist-credentials: false
      - name: Validate source head/tree before any compiler execution
        shell: pwsh
        env:
          APPROVED_HEAD: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_SHA }}
          APPROVED_TREE: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_TREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD).Trim()
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:APPROVED_HEAD -or
              $tree -cne $env:APPROVED_TREE) {
            throw 'Wrong approved Windows source commit/tree'
          }
          $dirty = (& git status --porcelain --untracked-files=all | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Dirty trusted Windows source checkout' }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Check installed Windows Native AOT toolchain
        shell: pwsh
        run: |
          dotnet --info
          ./verification/assert-aot-gates.ps1 -Rid win-x64
      - name: Run .NET compiler and runtime regression harness
        shell: pwsh
        run: dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
      - name: Verify real scalar and experimental structured static facts
        shell: pwsh
        run: |
          dotnet build compiler/Ores.Net.Compiler/Ores.Net.Compiler.csproj -c Release -warnaserror
          ./verification/assert-static-facts-v0.ps1
      - name: Publish and verify released Native AOT compiler
        shell: pwsh
        run: |
          ./scripts/publish-windows.ps1 -Source examples/hello.ores -Rid win-x64
          ./verification/assert-native-release.ps1 -Binary ./artifacts/compiler/win-x64/oresnet.exe -Rid win-x64
          ./verification/assert-native-release.ps1 -Binary ./artifacts/apps/win-x64/oreslang-app.exe -Rid win-x64
          ./verification/assert-native-compiler-cli.ps1 -Compiler ./artifacts/compiler/win-x64/oresnet.exe -ValidSource examples/hello.ores
      - name: Execute real published Windows Native AOT application
        shell: pwsh
        run: |
          ./verification/assert-native-pe.ps1 -Binary ./artifacts/compiler/win-x64/oresnet.exe -Rid win-x64
          ./verification/assert-native-pe.ps1 -Binary ./artifacts/apps/win-x64/oreslang-app.exe -Rid win-x64
          $output = & ./artifacts/apps/win-x64/oreslang-app.exe
          if ($LASTEXITCODE -ne 0 -or ($output | Out-String).Trim() -ne '14') {
            throw "Native AOT app output mismatch: expected 14, received '$output'"
          }
          ./verification/assert-native-arithmetic.ps1 -Rid win-x64
      - name: Match Native AOT static facts against managed facts at exact head
        shell: pwsh
        run: |
          $source = 'contracts/scalar/v1/fixtures/literal-42.ores'
          $native = & ./artifacts/compiler/win-x64/oresnet.exe static-facts $source
          if ($LASTEXITCODE -ne 0) { throw 'Native AOT static facts failed' }
          $managed = & dotnet run -c Release --project compiler/Ores.Net.Compiler/Ores.Net.Compiler.csproj -- static-facts $source
          if ($LASTEXITCODE -ne 0) { throw 'Managed static facts failed' }
          if (($native -join "`n") -cne ($managed -join "`n")) {
            throw 'Published Native AOT and managed static facts disagree'
          }
          $doc = (($native -join "`n") | ConvertFrom-Json)
          $digest = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($doc.version -ne 'ores-static-facts/v0' -or
              $doc.unit -cne "sha256:$digest" -or
              $doc.procedures[0].id -ne '__root__.main/0' -or
              @($doc.procedures[0].loops).Count -ne 0) {
            throw 'Published Native AOT static facts fail the shared contract'
          }
      - name: Record immutable source and native Windows executable hashes
        shell: pwsh
        env:
          APPROVED_HEAD: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_SHA }}
          APPROVED_TREE: ${{ vars.ORESLANG_NET_SELFHOSTED_WINDOWS_TREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((& git rev-parse HEAD).Trim() -cne $env:APPROVED_HEAD -or
              (& git rev-parse 'HEAD^{tree}').Trim() -cne $env:APPROVED_TREE) {
            throw 'Windows Native AOT source identity changed'
          }
          $paths = @('artifacts/compiler/win-x64/oresnet.exe',
                     'artifacts/apps/win-x64/oreslang-app.exe')
          $files = @($paths | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) { throw "Missing native binary: $_" }
            @{path = $_; sha256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()}
          })
          New-Item -ItemType Directory -Force -Path artifacts/evidence | Out-Null
          [ordered]@{
            schema = 'oreslang.net.source_local_windows_aot_v1'
            repository = $env:GITHUB_REPOSITORY
            workflow_sha = $env:GITHUB_SHA
            tested_source_head = $env:APPROVED_HEAD
            tested_root_tree = $env:APPROVED_TREE
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            binaries = $files
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath artifacts/evidence/source-local-windows.json
      - name: Upload immutable Windows Native AOT evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oreslang-net-source-local-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/source-local-windows.json
          if-no-files-found: error
          retention-days: 14
