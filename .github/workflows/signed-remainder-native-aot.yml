name: Canonical scalar operators and removed-percent source Native AOT
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2022
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable exact source before compiler execution
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_HEAD -cnotmatch '^[0-9a-f]{40}
        with:
          dotnet-version: 10.0.x
      - name: Verify parser, IR and CIL contracts
        run: dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
      - name: Execute 9 native canonical guests and reject 12 noncanonical percent cases
        shell: pwsh
        run: ./verification/assert-native-remainder.ps1 -Rid '${{ matrix.rid }}'
) {
            throw 'Expected source commit must be a full hexadecimal SHA'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_HEAD) {
            throw "Source checkout mismatch expected=$env:EXPECTED_HEAD actual=$actual"
          }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) {
            throw 'Compiler checkout is dirty before tests'
          }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -cnotmatch '^[0-9a-f]{40}
        with:
          dotnet-version: 10.0.x
      - name: Verify parser, IR and CIL contracts
        run: dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
      - name: Execute 9 native canonical guests and reject 12 noncanonical percent cases
        shell: pwsh
        run: ./verification/assert-native-remainder.ps1 -Rid '${{ matrix.rid }}'
) {
            throw 'Unable to pin source root tree identity'
          }
          Write-Output "EXACT_SOURCE_HEAD=$actual"
          Write-Output "EXACT_SOURCE_TREE=$tree"
          Write-Output "RUN_ID=$env:GITHUB_RUN_ID ATTEMPT=$env:GITHUB_RUN_ATTEMPT"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Verify parser, IR and CIL contracts
        run: dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
      - name: Execute 9 native canonical guests and reject 12 noncanonical percent cases
        shell: pwsh
        run: ./verification/assert-native-remainder.ps1 -Rid '${{ matrix.rid }}'
