name: Removed modulo source and checked arithmetic Native AOT
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2022
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Verify parser, IR and CIL contracts
        run: dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
      - name: Reject removed modulo and run checked arithmetic Native AOT
        shell: pwsh
        run: ./verification/assert-native-remainder.ps1 -Rid '${{ matrix.rid }}'
