name: Guest Result, trap and checked arithmetic

on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'runtime/Ores.Net.Runtime/**'
      - 'ci/test-guest-result*.sh'
      - 'tests/fixtures/guest-result-cil/**'
      - '.github/workflows/guest-result-cil.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coreclr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Run guest CIL and check compile-time denials
        run: |
          git log -1 --format='%H %T'
          bash ci/test-guest-result-cil.sh
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run guest NativeAOT executables
        run: |
          git log -1 --format='%H %T'
          bash ci/test-guest-result-native-macos.sh
