name: Control-plane Ref32 NativeAOT host (not guest)
on:
  pull_request:
    paths:
      - 'runtime/Ores.Net.Runtime/ControlPlaneArena32.cs'
      - 'verification/Ores.Net.ControlPlaneArenaProbe/**'
      - '.github/workflows/control-plane-ref32-nativeaot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  net-host-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and execute independent CLR probe
        run: dotnet run --project verification/Ores.Net.ControlPlaneArenaProbe/ControlPlaneArenaProbe.csproj -c Release
      - name: Compile real Linux native-AOT host executable
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
          dotnet publish verification/Ores.Net.ControlPlaneArenaProbe/ControlPlaneArenaProbe.csproj -c Release -r linux-x64 -p:PublishAot=true -o /tmp/atto-control-aot
          test -x /tmp/atto-control-aot/ControlPlaneArenaProbe
          file /tmp/atto-control-aot/ControlPlaneArenaProbe | grep -q ELF
      - name: Execute actual NativeAOT host executable
        run: /tmp/atto-control-aot/ControlPlaneArenaProbe
      - name: Scope of test
        run: echo 'HOST-ONLY unmanaged control arena; not compiled Atto source guest or zero-GC certification'
