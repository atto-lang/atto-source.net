name: Atto Counter detached critical-read syntax (NOT GUEST)
on:
  pull_request:
    paths:
      - 'compiler/Ores.Net.Compiler.Core/DeclaredActorReceiveSyntax.cs'
      - 'compiler/Ores.Net.Compiler.Core/Syntax.cs'
      - 'compiler/Ores.Net.Compiler/Program.cs'
      - 'verification/Ores.Net.Tests/**'
      - 'contracts/actor-counter-identical-source-v1/**'
      - 'tests/actor-counter-parity.test.mjs'
      - 'tools/actor-counter-parity.mjs'
      - '.github/workflows/declared-counter-receive-syntax.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-negative-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.100'
      - name: Report exact Git commit and source tree
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify all seven canonical source hashes and materialize bytes
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/actor-counter-parity.test.mjs
          node tools/actor-counter-parity.mjs materialize "$RUNNER_TEMP/atto-counter"
      - name: Execute typed syntax CLI on canonical .atto receive
        shell: bash
        run: |
          set -euo pipefail
          source_file="$RUNNER_TEMP/atto-counter/src/counter/receive.atto"
          dotnet run --project compiler/Ores.Net.Compiler -c Release -- check-declared-receive-syntax "$source_file" | tee "$RUNNER_TEMP/syntax-receipt.txt"
          grep -Fq 'NET_DECLARED_COUNTER_RECEIVE_SYNTAX_PASS|namespace=counter|actor=Counter|field=total|stop=4|guest_not_executed' "$RUNNER_TEMP/syntax-receipt.txt"
          if dotnet run --project compiler/Ores.Net.Compiler -c Release -- compile "$source_file" --out "$RUNNER_TEMP/OresGenerated.dll" > "$RUNNER_TEMP/unverified-ir" 2>&1; then
            echo 'UNSAFE: compiler accepted unlinked actor receive as ordinary guest' >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/OresGenerated.dll"
      - name: Reject mutated read-loan, forged state alias and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const source = fs.readFileSync(process.env.RUNNER_TEMP + '/atto-counter/src/counter/receive.atto', 'utf8');
          const cases = [
            ['live-loan-send', 'self.send(snapshot)', 'self.send(s.total)'],
            ['reader-side-effect', 'critical-read |s| -> s.total', 'critical-read |s| -> { self.send(s.total); }'],
            ['forged-critical-mode', 'critical-read', 'critical -read'],
            ['mutable-copy', 'val int snapshot', 'let int snapshot'],
            ['unowned-delta', 's.total + mail.value', 's.total + 1'],
            ['public-receive', 'external mtd', 'pub mtd']
          ];
          for (const [label, from, to] of cases) {
            if (!source.includes(from)) throw new Error('Mutation anchor missing: ' + label);
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, label + '.atto'), source.replace(from, to));
          }
          NODE
          for mutation in live-loan-send reader-side-effect forged-critical-mode mutable-copy unowned-delta public-receive; do
            if dotnet run --no-build --project compiler/Ores.Net.Compiler -c Release -- check-declared-receive-syntax "$RUNNER_TEMP/$mutation.atto" >"$RUNNER_TEMP/$mutation.out" 2>&1; then
              echo "UNSAFE: parser accepted mutation $mutation" >&2
              exit 1
            fi
            test ! -s "$RUNNER_TEMP/$mutation.out" || grep -Fq 'DECLARED_ACTOR_RECEIVE_REJECTED' "$RUNNER_TEMP/$mutation.out"
          done
      - name: Run source actor and runtime-managed verification
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project verification/Ores.Net.Tests -c Release
          echo 'NET_COUNTER_SCOPE=PARSED_SOURCE_PLUS_EXISTING_HOST_RUNTIME; FULL_ATTO_GUEST_NOT_EXECUTED'
