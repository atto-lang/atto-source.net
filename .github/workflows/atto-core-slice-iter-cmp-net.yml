name: Atto .NET core slice/iter/cmp typed CIL guest
on:
  pull_request:
    paths:
      - 'core/**'
      - 'library/atto.core/**'
      - 'compiler/Ores.Net.Compiler.Core/StructuredModuleLinking.cs'
      - 'compiler/Ores.Net.Compiler.Core/Ores.Net.Compiler.Core.csproj'
      - 'verification/Ores.Net.Tests/SourceModuleLinkingSelfTest.cs'
      - '.github/workflows/atto-core-slice-iter-cmp-net.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scalar-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source and closed compiler-owned resource bytes
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD) -cne $env:EXPECTED_HEAD) { throw 'Wrong source HEAD' }
          foreach ($kind in @('slice', 'iter', 'cmp')) {
            $a = (git hash-object --no-filters -- "core/$kind.atto").Trim()
            $b = (git hash-object --no-filters -- "library/atto.core/$kind.atto").Trim()
            if ($a -cne $b -or $a -cne (git rev-parse "HEAD:core/$kind.atto").Trim()) {
              throw "Core source drift: $kind"
            }
          }
          if (git status --porcelain) { throw 'Dirty checkout' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile typed source graph, execute CIL and run negative imports
        shell: pwsh
        run: |
          dotnet run -c Release --project verification/Ores.Net.Tests
          if ($LASTEXITCODE -ne 0) { throw 'Atto core slice/iter/cmp real CIL guest/regressions failed' }
          Write-Output "ATTO_CORE_SIC_NET_CIL_GUEST_EXECUTED=true"
