name: Compiler cache key envelope conformance
on:
  pull_request:
    paths:
      - 'compiler/Ores.Net.Compiler.Core/CompilerCacheKey.cs'
      - 'verification/Ores.Net.Tests/CompilerCacheKeySelfTest.cs'
      - 'compiler/Ores.Net.Compiler.Core/CompilerArtifactReceipt.cs'
      - 'verification/Ores.Net.Tests/CompilerArtifactReceiptSelfTest.cs'
      - 'compiler/Ores.Net.Compiler.Core/CompilerCacheLedger.cs'
      - 'verification/Ores.Net.Tests/CompilerCacheLedgerSelfTest.cs'
      - '.github/workflows/compiler-cache-key.yml'
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact head and physical tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git write-tree)" = "$(git rev-parse HEAD^{tree})"
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          git rev-parse HEAD HEAD^{tree}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile production compiler and execute cache key tests
        run: |
          set -eu
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          dotnet new console --framework net10.0 --no-restore --output "$work"
          dotnet add "$work" reference "$PWD/compiler/Ores.Net.Compiler.Core/Ores.Net.Compiler.Core.csproj"
          cp verification/Ores.Net.Tests/CompilerCacheKeySelfTest.cs "$work/"
          cmp verification/Ores.Net.Tests/CompilerCacheKeySelfTest.cs "$work/CompilerCacheKeySelfTest.cs"
          cp verification/Ores.Net.Tests/CompilerArtifactReceiptSelfTest.cs "$work/"
          cmp verification/Ores.Net.Tests/CompilerArtifactReceiptSelfTest.cs "$work/CompilerArtifactReceiptSelfTest.cs"
          cp verification/Ores.Net.Tests/CompilerCacheLedgerSelfTest.cs "$work/"
          cmp verification/Ores.Net.Tests/CompilerCacheLedgerSelfTest.cs "$work/CompilerCacheLedgerSelfTest.cs"
          printf '%s\n' 'CompilerCacheKeySelfTest.Run();' 'CompilerArtifactReceiptSelfTest.Run();' 'CompilerCacheLedgerSelfTest.Run();' > "$work/Program.cs"
          dotnet run --project "$work" --configuration Release
