name: Option pattern v1 source-only contract
on:
  pull_request:
    paths:
      - 'contracts/v1/OPTION_PATTERN_PARITY_V1.md'
      - 'contracts/v1/option-pattern-v1.json'
      - 'scripts/check_option_pattern_contract.py'
      - 'scripts/test_option_pattern_contract.py'
      - '.github/workflows/option-pattern-v1-contract.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/v1/OPTION_PATTERN_PARITY_V1.md'
      - 'contracts/v1/option-pattern-v1.json'
      - 'scripts/check_option_pattern_contract.py'
      - 'scripts/test_option_pattern_contract.py'
      - '.github/workflows/option-pattern-v1-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-inventory-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
      - name: Execute synthetic fail-closed harness regressions (not guest execution)
        run: python3 -m unittest discover -s scripts -p 'test_option_pattern_contract.py' -v
      - name: Wasm inventory must remain pending, never certified
        run: |
          python3 scripts/check_option_pattern_contract.py --backend wasm | grep -F 'PENDING_NO_COMPILER_EXECUTION'
