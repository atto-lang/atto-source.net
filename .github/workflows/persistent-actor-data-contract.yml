name: Persistent actor data v1 policy conformance
on:
  pull_request:
    paths:
      - 'contracts/v1/persistent_actor_data_v1.json'
      - 'scripts/verify_persistent_actor_data_contract.py'
      - 'scripts/test_persistent_actor_data_contract.py'
      - '.github/workflows/persistent-actor-data-contract.yml'
      - 'runtime/Ores.Net.Runtime/ActorArena.cs'
      - 'verification/Ores.Net.Tests/ActorArenaTests.cs'
      - 'verification/Ores.Net.Tests/Program.cs'
      - 'runtime/Ores.Net.Runtime/Ores.Net.Runtime.csproj'
  push:
    paths:
      - 'contracts/v1/persistent_actor_data_v1.json'
      - 'scripts/verify_persistent_actor_data_contract.py'
      - 'scripts/test_persistent_actor_data_contract.py'
      - '.github/workflows/persistent-actor-data-contract.yml'
      - 'runtime/Ores.Net.Runtime/ActorArena.cs'
      - 'verification/Ores.Net.Tests/ActorArenaTests.cs'
      - 'verification/Ores.Net.Tests/Program.cs'
      - 'runtime/Ores.Net.Runtime/Ores.Net.Runtime.csproj'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout before test execution
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Pin identical five-backend contract source blobs
        shell: bash
        run: |
          test "$(git hash-object contracts/v1/persistent_actor_data_v1.json)" = "83a40f637ab77437108d02fedc8cde997f753928"
          test "$(git ls-tree HEAD -- contracts/v1/persistent_actor_data_v1.json | awk '{print $1 ":" $2 ":" $3}')" = "100644:blob:83a40f637ab77437108d02fedc8cde997f753928"
          test -f contracts/v1/persistent_actor_data_v1.json && test ! -L contracts/v1/persistent_actor_data_v1.json
          test "$(git hash-object scripts/verify_persistent_actor_data_contract.py)" = "b51f648518aa4f0573a732716988684171b94867"
          test "$(git ls-tree HEAD -- scripts/verify_persistent_actor_data_contract.py | awk '{print $1 ":" $2 ":" $3}')" = "100644:blob:b51f648518aa4f0573a732716988684171b94867"
          test -f scripts/verify_persistent_actor_data_contract.py && test ! -L scripts/verify_persistent_actor_data_contract.py
          test "$(git hash-object scripts/test_persistent_actor_data_contract.py)" = "843d2e6f462ee1d8ab33dc0ad86d6c90b11d27e8"
          test "$(git ls-tree HEAD -- scripts/test_persistent_actor_data_contract.py | awk '{print $1 ":" $2 ":" $3}')" = "100644:blob:843d2e6f462ee1d8ab33dc0ad86d6c90b11d27e8"
          test -f scripts/test_persistent_actor_data_contract.py && test ! -L scripts/test_persistent_actor_data_contract.py
      - name: Compile contract and test files in isolated Python mode
        run: python3 -I -m py_compile scripts/verify_persistent_actor_data_contract.py scripts/test_persistent_actor_data_contract.py
      - name: Reject capability and fixture drift
        run: python3 -I scripts/verify_persistent_actor_data_contract.py
      - name: Execute negative policy mutation suite
        run: python3 -I scripts/test_persistent_actor_data_contract.py -v

  host-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout before test execution
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Execute .NET compiler, mailbox and unmanaged arena regressions
        run: dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
