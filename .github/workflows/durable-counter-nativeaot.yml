name: .NET NativeAOT durable Counter guest profile
on:
  pull_request:
    paths:
      - 'compiler/Ores.Net.Compiler.Core/DurableCounterSourceV1.cs'
      - 'compiler/Ores.Net.Compiler/Program.cs'
      - 'verification/durable_counter_nativeaot.mjs'
      - '.github/workflows/durable-counter-nativeaot.yml'
permissions:
  contents: read
jobs:
  nativeaot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Verify exact source and build native compiler
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD^{tree}
          sudo apt-get update -qq
          sudo apt-get install -y clang zlib1g-dev binutils
          dotnet publish compiler/Ores.Net.Compiler/Ores.Net.Compiler.csproj -c Release -r linux-x64 -o "$RUNNER_TEMP/atto-net-compiler" -warnaserror
          bash verification/assert-linux-native-release.sh "$RUNNER_TEMP/atto-net-compiler/oresnet"
          ATTO_NET_COMPILER="$RUNNER_TEMP/atto-net-compiler/oresnet" node verification/durable_counter_nativeaot.mjs
