name: Fixed buffer pool host-only NativeAOT
on:
  pull_request:
    paths:
      - 'runtime/Ores.Net.Runtime/NativeFixedBufferPoolV1.cs'
      - 'verification/Ores.Net.FixedBufferPoolProbe/**'
      - '.github/workflows/fixed-buffer-pool-host-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-pool-host:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            binary: Ores.Net.FixedBufferPoolProbe
          - os: windows-2022
            rid: win-x64
            binary: Ores.Net.FixedBufferPoolProbe.exe
    steps:
      - name: Checkout exact private source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head and immutable blob set
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          git rev-parse 'HEAD^{tree}'
          for path in runtime/Ores.Net.Runtime/NativeFixedBufferPoolV1.cs \
                      verification/Ores.Net.FixedBufferPoolProbe/Program.cs \
                      verification/Ores.Net.FixedBufferPoolProbe/Ores.Net.FixedBufferPoolProbe.csproj; do
            test "$(git hash-object "$path")" = "$(git rev-parse "HEAD:$path")"
            echo "$path $(git rev-parse "HEAD:$path")"
          done
      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile and execute managed HOST probe
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project verification/Ores.Net.FixedBufferPoolProbe -c Release |
            tee "$RUNNER_TEMP/fixed-pool-managed.log"
          grep -Fx 'HOST_ONLY_NATIVE_FIXED_BUFFER_POOL_V1_PASS|ops=100000|compiled_atto=NOT_EXECUTED|zero_alloc=NOT_PROVEN' "$RUNNER_TEMP/fixed-pool-managed.log"
      - name: Publish and execute NativeAOT HOST probe
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          dotnet publish verification/Ores.Net.FixedBufferPoolProbe/Ores.Net.FixedBufferPoolProbe.csproj \
            -c Release -r "$RID" -p:PublishAot=true -p:SelfContained=true \
            -o "$RUNNER_TEMP/fixed-pool-native"
          bin="$RUNNER_TEMP/fixed-pool-native/$BINARY"
          test -f "$bin"
          "$bin" | tee "$RUNNER_TEMP/fixed-pool-native.log"
          grep -Fx 'HOST_ONLY_NATIVE_FIXED_BUFFER_POOL_V1_PASS|ops=100000|compiled_atto=NOT_EXECUTED|zero_alloc=NOT_PROVEN' "$RUNNER_TEMP/fixed-pool-native.log"
          sha256sum "$bin"
