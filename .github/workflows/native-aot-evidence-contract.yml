name: Native AOT evidence contract self-test

on:
  pull_request:
    paths:
      - 'verification/ci-evidence-gate.mjs'
      - 'verification/ci-evidence-gate.test.mjs'
      - 'docs/CI_EVIDENCE_EXACT_HEAD.md'
      - '.github/workflows/windows-native-aot.yml'
      - '.github/workflows/strict-linux-native-aot.yml'
      - '.github/workflows/native-aot-evidence-contract.yml'
      - '.github/workflows/trusted-source-local-linux-aot.yml'
      - '.github/workflows/trusted-source-local-windows-aot.yml'
      - '.github/workflows/trusted-source-local-fence-windows.yml'
      - '.github/workflows/net-fence-smoke.yml'
      - '.github/workflows/actor-memory-native-aot.yml'
      - 'verification/trusted-source-local-aot-workflow.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact evidence source checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify strict evidence parser negative fixtures
        run: node --test verification/ci-evidence-gate.test.mjs
      - name: Verify source-local runner isolation and trusted workflow triggers
        run: node verification/trusted-source-local-aot-workflow.test.mjs
