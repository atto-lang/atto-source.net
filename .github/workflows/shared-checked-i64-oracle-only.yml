name: .NET shared checked-i64 source oracle (NOT NativeAOT guest)
on:
  pull_request:
    paths:
      - 'contracts/checked-i64-all-backends-v1/**'
      - 'tests/test_shared_checked_i64_corpus.py'
      - '.github/workflows/shared-checked-i64-oracle-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head and Git object bytes
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object --no-filters contracts/checked-i64-all-backends-v1/cases.tsv)" = "71309fac2ab6b2191a0056c84d78987bd342dce0"
          test "$(git hash-object --no-filters tests/test_shared_checked_i64_corpus.py)" = "$(git rev-parse HEAD:tests/test_shared_checked_i64_corpus.py)"
          echo "SOURCE_HEAD=$EXPECTED TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Execute actual Python source-only reference and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_shared_checked_i64_corpus.py' -v
          python3 -m py_compile tests/test_shared_checked_i64_corpus.py
          echo "PASS=SOURCE_ORACLE_ONLY NATIVEAOT_GUEST_EXECUTIONS=0"
