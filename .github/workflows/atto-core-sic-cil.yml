name: Atto core slice iter cmp focused CIL
on:
  pull_request:
    paths:
      - 'core/{slice,iter,cmp}.atto'
      - 'core/tests/slice_iter_cmp_smoke.atto'
      - 'library/atto.core/**'
      - 'compiler/Ores.Net.Compiler.Core/**'
      - 'verification/AttoCoreSliceIterCmpFocused/**'
      - '.github/workflows/atto-core-sic-cil.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typed-cil-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and execute emitted typed CIL Atto guest
        shell: bash
        run: |
          set -euo pipefail
          dotnet run -c Release --project verification/AttoCoreSliceIterCmpFocused/AttoCoreSliceIterCmpFocused.csproj
          echo "ATTO_CORE_SIC_NET_CIL_GUEST_PASS=TRUE"
