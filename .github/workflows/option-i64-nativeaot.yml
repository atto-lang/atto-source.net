name: .NET closed Option<int> NativeAOT guest proof (experimental)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-option-i64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind compiler and fixtures to immutable source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object contracts/option-i64/v1/option-some42.atto)" = 64c36f7221da489033a5c64d15588226c7f073cf
          test "$(git hash-object contracts/option-i64/v1/option-none42.atto)" = e49561e86f96ae60478f52a21c99160a20f339a0
          test "$(git hash-object contracts/option-i64/v1/option-is-none42.atto)" = c9ba0fa0bcd14863e098e77ff090ac9c4e46a893
          test "$(git hash-object contracts/option-i64/v1/option-equality42.atto)" = 771643415dfe2a8e7948fb5b9822a14835d20922
          test "$(git hash-object contracts/option-i64/v1/reject-nested-option.atto)" = ed0f192cfd3b6db259b24ae44ecb28fff57461dc
          test "$(git hash-object contracts/option-i64/v1/reject-unsafe-unwrap.atto)" = 2ffc57354271b6b8f679ee1776f5e1e3b04829d7
          test -z "$(git status --porcelain)"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler and execute real verified CFG/CIL tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet build compiler/Ores.Net.Compiler/Ores.Net.Compiler.csproj -c Release -warnaserror
          dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release | tee option-tests.log
          grep -F 'NET_OPTION_I64_CFG_CIL_TESTS_EXECUTED' option-tests.log
          compiler=compiler/Ores.Net.Compiler/Ores.Net.Compiler.csproj
          for source in contracts/option-i64/v1/option-{some42,none42,is-none42,equality42}.atto; do
            dotnet run --no-build --project "$compiler" -c Release -- check-structured "$source"
            if dotnet run --no-build --project "$compiler" -c Release -- check "$source"; then
              echo 'Shipping scalar compiler accepted experimental Option<int>' >&2
              exit 1
            fi
          done
          for source in contracts/option-i64/v1/reject-{nested-option,unsafe-unwrap}.atto; do
            if dotnet run --no-build --project "$compiler" -c Release -- check-structured "$source"; then
              echo "Option negative source unexpectedly accepted: $source" >&2
              exit 1
            fi
          done
      - name: Build actual Native AOT compiler and guest executables
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev binutils file
          bash scripts/publish-linux.sh contracts/option-i64/v1/option-some42.atto artifacts/option-i64-some --structured
          binary=artifacts/option-i64-some/linux-x64/oreslang-app
          bash verification/assert-linux-native-release.sh "$binary"
          test "$("$binary")" = 42
          bash scripts/publish-linux.sh contracts/option-i64/v1/option-none42.atto artifacts/option-i64-none --structured
          binary=artifacts/option-i64-none/linux-x64/oreslang-app
          bash verification/assert-linux-native-release.sh "$binary"
          test "$("$binary")" = 42
          bash scripts/publish-linux.sh contracts/option-i64/v1/option-is-none42.atto artifacts/option-i64-is-none --structured
          binary=artifacts/option-i64-is-none/linux-x64/oreslang-app
          bash verification/assert-linux-native-release.sh "$binary"
          test "$("$binary")" = 42
          bash scripts/publish-linux.sh contracts/option-i64/v1/option-equality42.atto artifacts/option-i64-equality --structured
          binary=artifacts/option-i64-equality/linux-x64/oreslang-app
          bash verification/assert-linux-native-release.sh "$binary"
          test "$("$binary")" = 42
          compiler=artifacts/compiler/linux-x64/oresnet
          for source in contracts/option-i64/v1/reject-{nested-option,unsafe-unwrap}.atto; do
            rejected=artifacts/option-i64-negative/OresGenerated.dll
            mkdir -p "$(dirname "$rejected")"
            rm -f -- "$rejected"
            if "$compiler" compile-structured "$source" --out "$rejected"; then
              echo "Native compiler accepted forbidden Option source: $source" >&2
              exit 1
            fi
            test ! -e "$rejected"
          done
          sha256sum artifacts/compiler/linux-x64/oresnet artifacts/option-i64-{some,none,is-none,equality}/linux-x64/oreslang-app
          echo "NET_OPTION_I64_LINUX_NATIVE_AOT_GUEST_42|head=$(git rev-parse HEAD)|Some=42|None=42|IsNone=42|Equality=42"
  windows-option-i64:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind source and fixture blobs
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_HEAD -or
              $env:EXPECTED_HEAD -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Wrong PR head: $actual"
          }
          $expected = @{
            'contracts/option-i64/v1/option-some42.atto' = '64c36f7221da489033a5c64d15588226c7f073cf'
            'contracts/option-i64/v1/option-none42.atto' = 'e49561e86f96ae60478f52a21c99160a20f339a0'
            'contracts/option-i64/v1/option-is-none42.atto' = 'c9ba0fa0bcd14863e098e77ff090ac9c4e46a893'
            'contracts/option-i64/v1/option-equality42.atto' = '771643415dfe2a8e7948fb5b9822a14835d20922'
            'contracts/option-i64/v1/reject-nested-option.atto' = 'ed0f192cfd3b6db259b24ae44ecb28fff57461dc'
            'contracts/option-i64/v1/reject-unsafe-unwrap.atto' = '2ffc57354271b6b8f679ee1776f5e1e3b04829d7'
          }
          foreach ($fixture in $expected.Keys) {
            if ((& git hash-object $fixture).Trim() -cne $expected[$fixture]) {
              throw "Option fixture bytes changed: $fixture"
            }
          }
          if (& git status --porcelain) { throw 'Dirty checkout' }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute real managed compiler and verified CIL regression
        shell: pwsh
        run: |
          dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Managed Option/CFG/CIL suite failed' }
          $source='contracts/option-i64/v1/option-some42.atto'
          dotnet run --project compiler/Ores.Net.Compiler/Ores.Net.Compiler.csproj -c Release -- check-structured $source
          if ($LASTEXITCODE -ne 0) { throw 'Managed compiler rejected positive Option source' }
      - name: Run actual Windows NativeAOT compiler and guests
        shell: pwsh
        run: |
          foreach ($variant in @('some42','none42','is-none42','equality42')) {
            $source = "contracts/option-i64/v1/option-$variant.atto"
            $destination = "artifacts/option-i64-$variant"
            ./scripts/publish-windows.ps1 -Source $source -Rid win-x64 -Output $destination -Structured
            if ($LASTEXITCODE -ne 0) { throw "Native AOT publish failed for $variant" }
            $binary = Join-Path $destination 'win-x64/oreslang-app.exe'
            ./verification/assert-native-release.ps1 -Binary $binary -Rid win-x64
            $actual = & $binary
            if ($LASTEXITCODE -ne 0 -or ($actual -join "`n").Trim() -cne '42') {
              throw "Option Native AOT guest result incorrect: $variant"
            }
            (Get-FileHash $binary -Algorithm SHA256).Hash
          }
          $compiler = 'artifacts/compiler/win-x64/oresnet.exe'
          foreach ($negative in @('reject-nested-option','reject-unsafe-unwrap')) {
            $source = "contracts/option-i64/v1/$negative.atto"
            $denied = 'artifacts/generated/RejectedOption.dll'
            Remove-Item -LiteralPath $denied -Force -ErrorAction SilentlyContinue
            & $compiler compile-structured $source --out $denied
            if ($LASTEXITCODE -eq 0 -or (Test-Path -LiteralPath $denied)) {
              throw "Native AOT compiler admitted forbidden Option source: $negative"
            }
          }
          Write-Host "NET_OPTION_I64_WINDOWS_NATIVE_AOT_GUEST_42|head=$((& git rev-parse HEAD).Trim())|Some=42|None=42|IsNone=42|Equality=42"
