# Source-owned private CI. This is NOT an alternative-organization source mirror.
name: AttoLang canonical core source snapshot (SOURCE ONLY)
on:
  pull_request:
    paths:
      - 'contracts/atto-core-v1/**'
      - 'tools/atto-core-snapshot/**'
      - 'tests/check_atto_core_snapshot.py'
      - 'tests/test_atto_core_snapshot.py'
      - '.github/workflows/atto-core-source-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-identity-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head without saved credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "ATTO_CORE_SNAPSHOT_HEAD=$EXPECTED_HEAD"
          echo "ATTO_CORE_SNAPSHOT_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Verify canonical source bytes with Rust and mutation denials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(command -v cargo)"
          cargo fmt --manifest-path tools/atto-core-snapshot/Cargo.toml -- --check
          cargo clippy --manifest-path tools/atto-core-snapshot/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path tools/atto-core-snapshot/Cargo.toml
          cargo run --quiet --manifest-path tools/atto-core-snapshot/Cargo.toml -- --repository-root .
          echo 'ATTO_CORE_SNAPSHOT_SOURCE_ONLY=YES'
          echo 'ATTO_CORE_NATIVE_GUEST_EXECUTION=NOT_EXECUTED'
