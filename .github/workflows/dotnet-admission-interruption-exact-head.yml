name: .NET graph admission interruption exact-head

on:
  push:
    branches:
      - feat/cpu-gpu-nb-graph-contract-20261016
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interruption:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact private source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ores-truffle-oreslang/oreslang-source.net'
          test "${{ github.event.repository.private }}" = true
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'SOURCE_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          printf 'RUNTIME_BLOB=%s\n' "$(git hash-object runtime/Ores.Net.Runtime/ExecutionGraphV1.cs)"
          printf 'TEST_BLOB=%s\n' "$(git hash-object verification/Ores.Net.Tests/ExecutionGraphV1Tests.cs)"
          grep -Fq 'ThreadInterruptedException ex' runtime/Ores.Net.Runtime/ExecutionGraphV1.cs
          grep -Fq 'ticket.RejectExecutor(ex);' runtime/Ores.Net.Runtime/ExecutionGraphV1.cs
          grep -Fq 'typed .NET pre-admission interruption: PASS' verification/Ores.Net.Tests/ExecutionGraphV1Tests.cs
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Execute exact managed interruption regression
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release | tee /tmp/ores-net-graph.txt
          grep -Fq 'typed .NET pre-admission interruption: PASS' /tmp/ores-net-graph.txt
          grep -Fq 'typed .NET CPU/GPU graph host contract: PASS' /tmp/ores-net-graph.txt
