name: AOT source-free runner admission triage

on:
  pull_request:
    paths:
      - '.github/workflows/aot-source-free-admission.yml'
  push:
    paths:
      - '.github/workflows/aot-source-free-admission.yml'
  workflow_dispatch:

permissions: {}

jobs:
  linux-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove Linux runner step execution without checkout
        shell: bash
        env:
          EXPECTED_REPO_ID: ${{ github.repository_id }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test -n "$RUNNER_NAME"
          [[ "$EXPECTED_REPO_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$GITHUB_RUN_ATTEMPT" = "$EXPECTED_ATTEMPT"
          printf 'ATTO_AOT_SOURCE_FREE_ADMISSION=EXECUTED os=%s repo_id=%s run_id=%s attempt=%s runner=%s\n' "$RUNNER_OS" "$EXPECTED_REPO_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME"
  macos-arm64-admission:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Prove macOS ARM64 runner step execution without checkout
        shell: bash
        env:
          EXPECTED_REPO_ID: ${{ github.repository_id }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -m)" = arm64
          test -n "$RUNNER_NAME"
          [[ "$EXPECTED_REPO_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$GITHUB_RUN_ATTEMPT" = "$EXPECTED_ATTEMPT"
          printf 'ATTO_AOT_SOURCE_FREE_ADMISSION=EXECUTED os=%s arch=%s repo_id=%s run_id=%s attempt=%s runner=%s\n' "$RUNNER_OS" "$(uname -m)" "$EXPECTED_REPO_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME"
