name: .NET safe-collection source admission (not guest parity)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-exact-head-collection-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind test to exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Test both real parser/IR paths and managed CLI
        shell: bash
        run: |
          set -euo pipefail
          project=compiler/Ores.Net.Compiler/Ores.Net.Compiler.csproj
          tests=verification/Ores.Net.Tests/Ores.Net.Tests.csproj
          positive=contracts/collections/v1/safe-scalar-control.atto
          negative=contracts/collections/v1/unsafe-index.atto
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          dotnet run --project "$tests" -c Release >"$work/tests.log" 2>&1 || {
            cat "$work/tests.log" >&2
            exit 1
          }
          grep -F 'SAFE_COLLECTION_ADMISSION_V1|indexed_rejections=11|frontends=2' "$work/tests.log"
          dotnet run --project "$project" -c Release -- check "$positive"
          dotnet run --project "$project" -c Release -- check-structured "$positive"
          dotnet run --project "$project" -c Release -- compile "$positive" --out "$work/OresGenerated.dll"
          test -s "$work/OresGenerated.dll"
          rm -f -- "$work/OresGenerated.dll"
          for mode in check check-structured compile compile-structured; do
            args=("$mode" "$negative")
            if [[ "$mode" == compile* ]]; then args+=(--out "$work/OresGenerated.dll"); fi
            if dotnet run --project "$project" -c Release -- "${args[@]}" >"$work/negative.log" 2>&1; then
              echo "Unverified collection access admitted by $mode" >&2
              exit 1
            fi
            grep -F 'E_SAFE_COLLECTION_ACCESS_UNSUPPORTED:' "$work/negative.log"
            test ! -e "$work/OresGenerated.dll"
          done
          echo 'NET_SAFE_COLLECTION_SOURCE_GATE_EXECUTED|managed_compiler=YES|guest_option_borrow=NOT_IMPLEMENTED'
