name: Checked i64 guest proof v1

on:
  pull_request:
    paths:
      - "contracts/parity/v1/checked-i64-42.ores"
      - ".github/workflows/checked-i64-guest-proof-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-aot-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin exact source and shared guest bytes
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object contracts/parity/v1/checked-i64-42.ores)" = "8e4f76fa1e4752f4996d464cd02a86f609430118"
          git diff --quiet --exit-code HEAD --
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Native AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev binutils file
      - name: Publish exact-head compiler and checked-i64 guest as Native AOT
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/publish-linux.sh             contracts/parity/v1/checked-i64-42.ores             artifacts/checked-i64-guest
          compiler=artifacts/compiler/linux-x64/oresnet
          guest=artifacts/checked-i64-guest/linux-x64/oreslang-app
          bash verification/assert-linux-native-release.sh "$compiler"
          bash verification/assert-linux-native-release.sh "$guest"
          test "$("$guest")" = 42
          mkdir -p artifacts/evidence/checked-i64-v1
          sha256sum "$compiler" > artifacts/evidence/checked-i64-v1/compiler-sha256.txt
          sha256sum "$guest" > artifacts/evidence/checked-i64-v1/guest-sha256.txt
          sha256sum contracts/parity/v1/checked-i64-42.ores > artifacts/evidence/checked-i64-v1/source-sha256.txt
          git rev-parse HEAD > artifacts/evidence/checked-i64-v1/head-sha.txt
          git rev-parse 'HEAD^{tree}' > artifacts/evidence/checked-i64-v1/tree-sha.txt
          printf '%s
' 42 > artifacts/evidence/checked-i64-v1/guest-stdout.txt
      - name: Upload Native AOT compiler and guest proof receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checked-i64-guest-net-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evidence/checked-i64-v1/
            artifacts/compiler/linux-x64/oresnet
            artifacts/checked-i64-guest/linux-x64/oreslang-app
          if-no-files-found: error
          retention-days: 14
