name: Macro scalar exact-source Native AOT

on:
  pull_request:
    paths:
      - 'compiler/Ores.Net.Compiler.Core/Syntax.cs'
      - 'compiler/Ores.Net.Compiler.Core/StructuredSource.cs'
      - 'verification/Ores.Net.Tests/**'
      - 'verification/fixtures/macro-*.atto'
      - 'verification/verify-macro-scalar-native-aot.sh'
      - '.github/workflows/macro-scalar-native-aot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scalar-macro-native-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned setup-dotnet action and .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Check exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          printf 'MACRO_PR_HEAD=%s\nMACRO_PR_TREE=%s\n' "$actual" "$(git rev-parse HEAD^{tree})"
      - name: Install native-AOT build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Execute compiler tests and three independent Native AOT macro guests
        shell: bash
        run: bash verification/verify-macro-scalar-native-aot.sh
