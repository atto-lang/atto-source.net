name: Spin HTTP host Native AOT
on:
  push:
    branches: ['feat/spin-http-*', 'ci/spin-http-*']
  pull_request:
    paths:
      - 'runtime/Ores.Net.Runtime/**'
      - 'runtime/Ores.Net.Runtime.Http/**'
      - 'verification/Ores.Net.HttpProbe/**'
      - 'verification/Ores.Net.Tests/**'
      - '.github/workflows/spin-http-native-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-http-native-aot:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            binary: Ores.Net.HttpProbe
          - os: windows-2022
            rid: win-x64
            binary: Ores.Net.HttpProbe.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Verify checkout and existing runtime regressions
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_HEAD) { throw 'Checkout identity mismatch' }
          dotnet run -c Release --project verification/Ores.Net.Tests
          if ($LASTEXITCODE -ne 0) { throw 'Runtime regression suite failed' }
      - name: Publish and execute real HTTP Native AOT probe
        shell: pwsh
        run: |
          dotnet publish verification/Ores.Net.HttpProbe -c Release -r '${{ matrix.rid }}' -p:PublishAot=true -o artifacts/http-native
          if ($LASTEXITCODE -ne 0) { throw 'Native AOT publish failed' }
          $binary = Join-Path 'artifacts/http-native' '${{ matrix.binary }}'
          $output = & $binary
          if ($LASTEXITCODE -ne 0) { throw 'Native HTTP probe failed' }
          $output
          @{source_commit=(git rev-parse HEAD); source_tree=(git rev-parse 'HEAD^{tree}'); rid='${{ matrix.rid }}'; binary_sha256=(Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant(); probe_output=$output; scope='host-provider-only-not-Oreslang-source-parity'} | ConvertTo-Json -Depth 4 | Set-Content artifacts/http-native/receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spin-http-host-${{ matrix.rid }}
          path: artifacts/http-native/
