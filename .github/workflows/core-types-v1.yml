name: core/types independent source-level behavior oracle
on:
  pull_request:
    paths:
      - 'core/types.atto'
      - 'tests/core-types-source.test.mjs'
      - 'tests/core-types-matrix-source.test.mjs'
      - 'tests/fixtures/core-types-v1/**'
      - '.github/workflows/core-types-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check exact PR head and Git tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
      - name: Run freestanding Atto source oracle and mutation controls
        run: |
          set -euo pipefail
          node --test tests/core-types-source.test.mjs tests/core-types-matrix-source.test.mjs
          echo 'CORE_TYPES_SOURCE_ONLY=PASS'
          echo 'CORE_TYPES_COMPILED_GUEST=NOT_EXECUTED_BY_THIS_JOB'
      - name: Preserve evidence boundary
        if: always()
        run: echo 'This workflow runs a strict source-model oracle only; it neither compiles Atto nor proves NativeAOT/Wasm/JIT guest execution.' >> "$GITHUB_STEP_SUMMARY"
  core-types-native-compiler-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact revision before compiler run
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile actual namespace .atto through native CIL frontend
        run: |
          set -euo pipefail
          dotnet build compiler/Atto.Cil.Compiler/Atto.Cil.Compiler.csproj -c Release --nologo
          mkdir -p artifacts
          dotnet run --no-build -c Release --project compiler/Atto.Cil.Compiler/Atto.Cil.Compiler.csproj -- core/types.atto artifacts/CoreTypes.dll
          test -s artifacts/CoreTypes.dll
          echo 'CORE_TYPES_NET_CIL_COMPILED=YES'
      - name: Evidence limits
        if: always()
        run: echo 'CIL compilation only; full guest execution and NativeAOT require separate gates. Zero executed steps means NOT_EXECUTED.' >> "$GITHUB_STEP_SUMMARY"
