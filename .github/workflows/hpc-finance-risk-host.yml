name: HPC finance .NET source and risk host-contract verification
on:
  pull_request:
    paths:
      - 'verification/Ores.Net.Tests/HpcFinanceRiskHostParityTests.cs'
      - 'verification/Ores.Net.Tests/Program.cs'
      - 'verification/Ores.Net.Tests/Ores.Net.Tests.csproj'
      - 'contracts/v1/hpc-finance/**'
      - '.github/workflows/hpc-finance-risk-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hpc-risk-net-host-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source identity and 23-case shared Git blob
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git hash-object contracts/v1/hpc-finance/risk-gate-v1.tsv)" = cec489c1f7603617797340dd1b4a71cc85acfebd
          printf 'NET_HPC_HOST_SOURCE_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build managed verification program
        run: dotnet build verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release -warnaserror
      - name: Execute source parser denials, risk reference and full managed test entrypoint
        run: |
          set -euo pipefail
          dotnet run --no-build --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release |
            tee /tmp/hpc-net-output.log
          grep -Fqx 'HPC_FINANCE_HOST_ONLY=PASS 23-fixture 180-cross-product 4-mutations; guest f64/Region unsupported' /tmp/hpc-net-output.log
      - name: Retain accurate evidence class
        run: echo 'NET_HPC_EVIDENCE=HOST_ONLY_AND_UNSUPPORTED_SOURCE_DENIAL_NOT_NATIVEAOT'
